<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PatPat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --mint: #BFEFE0;
    --teal: #87CBB9;
    --sand: #D6C7B0;
    --cream: #F3EDE2;
    --slate: #6B7280;
    --ink: #3f4450;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--cream); color: var(--ink);
    font-family: "Gowun Dodum", system-ui, sans-serif;
    display: flex; justify-content: center; overflow: hidden;
  }
  button { font: inherit; cursor: pointer; }
  .app { position: relative; width: 100%; max-width: 560px; height: 100%; overflow: hidden; }
  .view { position: absolute; inset: 0; display: flex; flex-direction: column; transition: transform .3s ease; }
  .thread { background: var(--cream); transform: translateX(100%); }
  .app.open .thread { transform: none; }
  .app.open .feed { transform: translateX(-30%); }

  header { display: flex; align-items: center; gap: 12px; padding: 18px 20px 12px; }
  header h1 { font-size: 22px; font-weight: 400; flex: 1; }
  header p { font-size: 13px; color: var(--slate); }
  .back { border: 0; background: none; font-size: 22px; color: var(--slate); }
  .upload {
    border: 0; background: var(--teal); color: #fff; font-size: 14px;
    padding: 8px 14px; border-radius: 999px;
  }

  /* 피드: 사진 = 대화 주제 */
  .posts { flex: 1; overflow-y: auto; padding: 4px 16px 32px; display: flex; flex-direction: column; gap: 22px; }
  .post { background: none; border: 0; text-align: left; color: inherit; display: flex; flex-direction: column; gap: 10px; }
  .photo {
    width: 100%; aspect-ratio: 4 / 5; border-radius: 20px; background-size: cover; background-position: center;
    position: relative; overflow: hidden;
  }
  .photo .cap {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 18px 16px;
    background: linear-gradient(#0000, #0006); color: #fff; font-size: 17px;
  }
  .meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--slate); padding: 0 4px; }
  .avatars { display: flex; }
  .av {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--cream);
    display: grid; place-items: center; font-size: 11px; color: #fff; margin-left: -6px;
  }
  .av:first-child { margin-left: 0; }
  .peek { font-size: 14px; color: var(--ink); padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .peek b { font-weight: 400; color: var(--slate); margin-right: 6px; }

  /* 스레드 */
  .t-body { flex: 1; overflow-y: auto; padding: 0 16px 16px; }
  .t-photo { aspect-ratio: 4 / 3; }
  .replies { display: flex; flex-direction: column; gap: 16px; margin-top: 18px; }
  .reply { display: grid; grid-template-columns: 32px 1fr; gap: 10px; animation: rise .3s ease both; }
  .reply .av { width: 32px; height: 32px; font-size: 13px; border: 0; margin: 0; }
  .reply .who { font-size: 13px; color: var(--slate); }
  .reply .who span { margin-left: 6px; font-size: 12px; opacity: .7; }
  .reply .text { font-size: 16px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .reacts { display: flex; gap: 6px; margin-top: 6px; }
  .react {
    border: 1px solid var(--sand); background: #fff8; border-radius: 999px;
    font-size: 12px; padding: 2px 8px; color: var(--slate);
  }
  .react.on { background: var(--mint); border-color: var(--teal); color: var(--ink); }

  footer { padding: 10px 16px 18px; }
  .input {
    display: flex; align-items: flex-end; background: #fff;
    border-radius: 24px; padding: 6px 6px 6px 18px; border: 1px solid #d6c7b088;
  }
  textarea {
    flex: 1; border: 0; outline: 0; resize: none; background: none;
    font: inherit; font-size: 16px; color: var(--ink); line-height: 1.5; padding: 6px 0; max-height: 120px;
  }
  .send { border: 0; background: var(--teal); color: #fff; font-size: 14px; padding: 9px 16px; border-radius: 18px; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
</style>
</head>
<body>
<div class="app" id="app">
  <section class="view feed">
    <header>
      <div style="flex:1"><h1>우리 넷</h1><p>사진 하나에 이야기 하나</p></div>
      <button class="upload" id="upload">사진 올리기</button>
      <input type="file" id="file" accept="image/*" hidden>
    </header>
    <main class="posts" id="posts"></main>
  </section>

  <section class="view thread">
    <header>
      <button class="back" id="back" aria-label="뒤로">←</button>
      <div style="flex:1"><h1 id="tTitle"></h1><p id="tSub"></p></div>
    </header>
    <div class="t-body" id="tBody"></div>
    <footer>
      <div class="input">
        <textarea id="msg" rows="1" placeholder="이 사진에 한마디"></textarea>
        <button class="send" id="send">보내기</button>
      </div>
    </footer>
  </section>
</div>

<script>
  const people = {
    me:   { name: "나",   color: "#87CBB9" },
    jiwoo:{ name: "지우", color: "#D6C7B0" },
    hana: { name: "하나", color: "#6B7280" },
    seo:  { name: "서진", color: "#a9d9c9" },
  };
  // 샘플 사진 대신 그라데이션
  const posts = [
    { by: "jiwoo", time: "방금", caption: "퇴근길 하늘 미쳤다",
      bg: "linear-gradient(160deg,#f6c9a8,#e9a3a0 45%,#6B7280)",
      replies: [
        { by: "hana", time: "방금", text: "어디야 이거?? 색감 뭐임", reacts: { "😮": 2 } },
        { by: "jiwoo", time: "방금", text: "합정역 앞 육교", reacts: {} },
      ] },
    { by: "seo", time: "2시간 전", caption: "오늘의 점심 평가 부탁",
      bg: "linear-gradient(200deg,#F3EDE2,#D6C7B0 50%,#a88f6a)",
      replies: [
        { by: "me", time: "1시간 전", text: "7점. 김치가 부족해 보임", reacts: { "😂": 3 } },
        { by: "hana", time: "1시간 전", text: "나는 9점 줌", reacts: {} },
        { by: "seo", time: "58분 전", text: "김치 리필 무한이었음 다들 오해", reacts: { "😂": 1 } },
      ] },
    { by: "hana", time: "어제", caption: "주말에 여기 갈 사람",
      bg: "linear-gradient(170deg,#BFEFE0,#87CBB9 55%,#4d8d7d)",
      replies: [
        { by: "jiwoo", time: "어제", text: "나 토요일 가능", reacts: { "👍": 2 } },
      ] },
  ];

  const app = document.getElementById("app");
  const msg = document.getElementById("msg");
  let current = null;

  function av(id) {
    const p = people[id];
    return `<span class="av" style="background:${p.color}">${p.name[0]}</span>`;
  }
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function renderFeed() {
    const el = document.getElementById("posts");
    el.innerHTML = "";
    posts.forEach((p, i) => {
      const last = p.replies[p.replies.length - 1];
      const who = [...new Set(p.replies.map(r => r.by))].slice(0, 3);
      const b = document.createElement("button");
      b.className = "post";
      b.innerHTML = `
        <div class="photo" style="background-image:${p.bg}"><div class="cap">${esc(p.caption)}</div></div>
        <div class="meta"><span class="avatars">${who.map(av).join("")}</span>
          ${people[p.by].name} · ${p.time} · 댓글 ${p.replies.length}</div>
        ${last ? `<div class="peek"><b>${people[last.by].name}</b>${esc(last.text)}</div>` : ""}`;
      b.onclick = () => openThread(i);
      el.appendChild(b);
    });
  }

  function renderThread() {
    const p = posts[current];
    document.getElementById("tTitle").textContent = p.caption;
    document.getElementById("tSub").textContent = `${people[p.by].name} · ${p.time}`;
    const body = document.getElementById("tBody");
    body.innerHTML = `<div class="photo t-photo" style="background-image:${p.bg}"></div><div class="replies"></div>`;
    const list = body.querySelector(".replies");
    p.replies.forEach(r => {
      const d = document.createElement("div");
      d.className = "reply";
      const reacts = Object.entries(r.reacts).map(([e, n]) =>
        `<button class="react${r.mine === e ? " on" : ""}" data-e="${e}">${e} ${n}</button>`).join("");
      d.innerHTML = `${av(r.by)}<div>
        <div class="who">${people[r.by].name}<span>${r.time}</span></div>
        <div class="text">${esc(r.text)}</div>
        <div class="reacts">${reacts}<button class="react add" data-e="❤️">+</button></div></div>`;
      d.querySelectorAll(".react").forEach(btn => btn.onclick = () => toggleReact(r, btn.dataset.e));
      list.appendChild(d);
    });
    body.scrollTop = body.scrollHeight;
  }

  function toggleReact(r, e) {
    if (r.mine) { r.reacts[r.mine]--; if (!r.reacts[r.mine]) delete r.reacts[r.mine]; }
    if (r.mine === e) { r.mine = null; }
    else { r.reacts[e] = (r.reacts[e] || 0) + 1; r.mine = e; }
    renderThread();
  }

  function openThread(i) { current = i; renderThread(); app.classList.add("open"); }
  document.getElementById("back").onclick = () => { app.classList.remove("open"); renderFeed(); };

  function send() {
    const text = msg.value.trim();
    if (!text || current === null) return;
    posts[current].replies.push({ by: "me", time: "방금", text, reacts: {} });
    msg.value = ""; msg.style.height = "auto";
    renderThread();
  }
  document.getElementById("send").onclick = send;
  msg.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  msg.addEventListener("input", () => { msg.style.height = "auto"; msg.style.height = msg.scrollHeight + "px"; });

  // 사진 올리기: 새 스레드 생성
  const file = document.getElementById("file");
  document.getElementById("upload").onclick = () => file.click();
  file.onchange = () => {
    const f = file.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    posts.unshift({ by: "me", time: "방금", caption: "새 사진", bg: `url(${url})`, replies: [] });
    file.value = "";
    renderFeed();
    openThread(0);
  };

  renderFeed();
</script>
</body>
</html>
