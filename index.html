<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PatPat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mint: #BFEFE0;
    --teal: #87CBB9;
    --deep: #4f9a87;
    --sand: #D6C7B0;
    --cream: #F3EDE2;
    --slate: #6B7280;
    --ink: #2f3440;
    --card: #fbf8f3;
    --shadow: 0 8px 20px #6b72801f, 0 1px 2px #6b728014;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--cream); color: var(--ink);
    font-family: "Noto Sans KR", system-ui, sans-serif; letter-spacing: -0.01em;
    display: flex; justify-content: center; overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  .app { position: relative; width: 100%; max-width: 480px; height: 100%; overflow: hidden; }
  .view { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--cream); transition: transform .3s ease; }
  .thread {
    transform: translateX(100%); color: #fff;
    background-color: var(--slate); background-size: cover; background-position: center;
  }
  .bars { display: flex; gap: 4px; padding: 12px 20px 0; }
  .bars i { flex: 1; height: 3px; border-radius: 3px; background: #fff6; }
  .bars i.on { background: #fff; }
  .thread .icon-btn { background: #0003; color: #fff; box-shadow: none; backdrop-filter: blur(8px); }
  .thread .sub { color: #ffffffcc; }
  .thread .t-head h1 { text-shadow: 0 1px 8px #0005; }
  .thread .chip { background: #ffffff33; color: #fff; box-shadow: none; backdrop-filter: blur(8px); }
  .thread .chip.on { background: #fff; color: var(--ink); }
  .thread .replies { justify-content: flex-end; min-height: 50%; }
  .thread .bubble { background: #ffffffd9; color: var(--ink); backdrop-filter: blur(12px); box-shadow: none; }
  .thread .reply.me .bubble { background: #bfefe0e6; }
  .thread .pill { background: #0000004d; backdrop-filter: blur(8px); }
  .thread .reply.me .pill { background: #87cbb9cc; }
  .thread .input { background: #ffffffe6; backdrop-filter: blur(12px); }
  .app.open .thread { transform: none; }
  .app.open .home { transform: translateX(-25%); }

  /* 공통 */
  .top { display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 8px; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px; background: var(--card);
    box-shadow: var(--shadow); display: grid; place-items: center; color: var(--slate); font-size: 18px;
  }
  .scroll { flex: 1; overflow-y: auto; padding-bottom: 28px; }
  .av {
    width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center;
    font-size: 12px; font-weight: 500; color: #fff; border: 2px solid var(--card); flex: none;
  }
  .stack { display: flex; align-items: center; }
  .stack .av { margin-left: -8px; }
  .stack .av:first-child { margin-left: 0; }
  .stack small { margin-left: 6px; font-size: 12px; color: inherit; opacity: .8; }
  .thumb { width: 36px; height: 36px; border-radius: 10px; flex: none; background-size: cover; background-position: center; }
  .plus {
    width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid currentColor;
    display: grid; place-items: center; font-size: 18px; line-height: 1;
  }
  .count {
    min-width: 26px; height: 26px; padding: 0 8px; border-radius: 999px; background: var(--teal);
    color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center;
  }

  /* 홈 */
  .hello { padding: 8px 0 16px; }
  .hello p { color: var(--slate); font-size: 15px; }
  .hello h1 { font-size: 23px; font-weight: 700; margin-top: 2px; }
  .hello-row { display: flex; align-items: center; gap: 4px; padding-left: 20px; }
  .new {
    width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--deep); color: #fff;
    font-size: 16px; line-height: 1; box-shadow: 0 4px 10px #4f9a8744;
  }
  .rail { display: flex; gap: 14px; overflow-x: auto; padding: 4px 20px 16px; scroll-snap-type: x mandatory; scroll-padding-inline: 20px; }
  .rail::-webkit-scrollbar { display: none; }
  .tcard {
    flex: none; width: 220px; border-radius: 22px; padding: 16px; text-align: left;
    background: var(--card); box-shadow: var(--shadow); scroll-snap-align: start;
    display: flex; flex-direction: column; gap: 12px;
  }
  .tcard.photo {
    width: 230px; min-height: 250px; color: #fff; justify-content: flex-end;
    background-size: cover; background-position: center;
  }
  .tcard.photo .who-row { margin-bottom: auto; }
  .tcard.photo .sub, .tcard.photo .last { color: #ffffffd9; }
  .tcard.photo .av { border-color: #fff6; }
  .tcard.photo h3 { font-size: 18px; text-shadow: 0 1px 6px #0004; }
  .who-row { display: flex; align-items: center; gap: 10px; }
  .who-row b { font-size: 13px; font-weight: 700; display: block; }
  .sub { font-size: 11px; color: var(--slate); }
  .tcard h3 { font-size: 16px; font-weight: 700; line-height: 1.35; }
  .last { font-size: 12px; color: var(--slate); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tcard .foot { display: flex; align-items: center; justify-content: space-between; }
  .unread { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; }
  .unread i { width: 7px; height: 7px; border-radius: 50%; background: #f0a58a; }

  .sec { display: flex; align-items: center; justify-content: space-between; padding: 8px 20px 10px; }
  .sec h2 { font-size: 13px; font-weight: 500; color: var(--slate); letter-spacing: 0.04em; }
  .sec .count { min-width: 20px; height: 20px; padding: 0 6px; font-size: 11px; }
  .rooms { flex: 1; min-width: 0; display: flex; gap: 8px; overflow-x: auto; padding: 6px 20px 8px 4px; scroll-snap-type: x proximity; }
  .rooms::-webkit-scrollbar { display: none; }
  .rooms button { flex: none; white-space: nowrap; scroll-snap-align: start; }
  .rooms button { font-size: 13px; padding: 6px 14px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); color: var(--slate); }
  .rooms button.on { background: var(--deep); color: #fff; }
  .empty { font-size: 13px; color: var(--slate); padding: 18px; border-radius: 18px; border: 1.5px dashed var(--sand); text-align: center; flex: 1; }
  .tcard.text h3 { font-size: 22px; line-height: 1.3; text-shadow: none; }
  .sheet { margin: 0 20px 16px; padding: 14px; border-radius: 20px; background: var(--card); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
  .sheet textarea { width: 100%; min-height: 64px; }
  .sheet-row { display: flex; align-items: center; gap: 8px; }
  .sheet-row .picked { width: 32px; height: 32px; border-radius: 8px; background-size: cover; background-position: center; }
  .sheet-row .send { margin-left: auto; }
  .ghost { font-size: 13px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--sand); color: var(--slate); }
  .rooms .av { width: 20px; height: 20px; font-size: 10px; border: 0; margin-right: 4px; vertical-align: -5px; }
  .dm-btn { margin-top: 12px; font-size: 13px; padding: 7px 14px; border-radius: 999px; background: #ffffffe6; color: var(--ink); }
  .ref { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 8px 12px 8px 8px; border-radius: 14px; background: #ffffff33; backdrop-filter: blur(8px); width: fit-content; max-width: 100%; }
  .ref b { display: block; font-size: 13px; font-weight: 500; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--slate); }
  .toggle input { accent-color: var(--deep); width: 16px; height: 16px; }
  .keep-btn { margin-top: 12px; margin-right: 6px; font-size: 13px; padding: 7px 14px; border-radius: 999px; background: #ffffff33; color: #fff; backdrop-filter: blur(8px); }
  .keep-btn.on { background: #fff; color: var(--ink); }
  .keep-note { display: inline-block; margin-top: 12px; font-size: 12px; color: #ffffffcc; }
  .pin { font-size: 11px; color: var(--slate); }
  .left { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #0003; backdrop-filter: blur(6px); margin-left: auto; align-self: flex-start; }
  .list { display: flex; flex-direction: column; gap: 10px; padding: 0 20px; }
  .row {
    display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px;
    background: var(--card); box-shadow: var(--shadow); text-align: left; width: 100%;
  }
  .row .mid { flex: 1; min-width: 0; }
  .row h4 { font-size: 14px; font-weight: 500; }
  .row .time { font-size: 11px; color: var(--slate); align-self: flex-start; }

  /* 스레드 */
  .t-head { padding: 4px 20px 14px; }
  .t-head h1 { font-size: 21px; font-weight: 700; margin-top: 10px; line-height: 1.35; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .chip { font-size: 12px; padding: 5px 12px; border-radius: 999px; background: var(--card); color: var(--slate); box-shadow: var(--shadow); }
  .chip.on { background: var(--deep); color: #fff; }
  .replies { display: flex; flex-direction: column; gap: 14px; padding: 0 20px; }
  .reply { display: grid; grid-template-columns: 58px 1fr; gap: 10px; align-items: start; animation: rise .3s ease both; }
  .pill {
    font-size: 11px; font-weight: 500; text-align: center; padding: 5px 0; border-radius: 999px;
    background: var(--sand); color: #fff; margin-top: 12px;
  }
  .bubble { background: var(--card); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow); }
  .reply.me .bubble { background: var(--mint); }
  .reply.me .pill { background: var(--teal); }
  .bubble .who-row { gap: 8px; }
  .bubble .who-row .av { width: 24px; height: 24px; font-size: 11px; border: 0; }
  .bubble p { font-size: 15px; line-height: 1.55; margin-top: 6px; white-space: pre-wrap; word-break: break-word; }
  .reacts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .react { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: #fff9; border: 1px solid #d6c7b0aa; color: var(--slate); }
  .react.on { background: var(--teal); border-color: var(--teal); color: #fff; }

  footer { padding: 10px 16px 18px; }
  .input {
    display: flex; align-items: flex-end; gap: 8px; background: var(--card); box-shadow: var(--shadow);
    border-radius: 22px; padding: 6px 6px 6px 16px;
  }
  textarea {
    flex: 1; border: 0; outline: 0; resize: none; background: none; font: inherit;
    font-size: 15px; color: var(--ink); line-height: 1.5; padding: 7px 0; max-height: 120px;
  }
  .send { background: var(--deep); color: #fff; font-size: 14px; font-weight: 500; padding: 9px 16px; border-radius: 16px; }
  :focus-visible { outline: 2px solid var(--deep); outline-offset: 2px; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
</style>
</head>
<body>
<div class="app" id="app">
  <section class="view home">
    <div class="top">
      <span class="av" style="width:40px;height:40px;font-size:15px;background:var(--teal)">나</span>
      <button class="icon-btn" aria-label="검색">⌕</button>
    </div>
    <div class="scroll">
      <div class="hello hello-row">
        <button class="new" id="upload" aria-label="새 스레드 시작" aria-expanded="false">＋</button>
        <div class="rooms" id="rooms"></div>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
      <div class="sheet" id="sheet" hidden>
        <textarea id="draft" rows="2" placeholder="사진 없이 글만 올려도 돼요"></textarea>
        <div class="sheet-row">
          <button class="ghost" id="pick">사진 추가</button>
          <span class="picked" id="picked" hidden></span>
          <label class="toggle"><input type="checkbox" id="allowKeep" checked> 보관 허용</label>
          <button class="send" id="post">올리기</button>
        </div>
      </div>
      <div class="rail" id="hot"></div>
      <div class="sec" id="pastSec"><h2>History</h2><span class="count" id="allCount"></span></div>
      <div class="list" id="all"></div>
    </div>
  </section>

  <section class="view thread" id="thread">
    <div class="bars" id="bars"></div>
    <div class="top">
      <button class="icon-btn" id="back" aria-label="뒤로">←</button>
      <button class="icon-btn" aria-label="더보기">⋯</button>
    </div>
    <div class="scroll" id="tScroll" style="display:flex;flex-direction:column">
      <div class="t-head" id="tHead"></div>
      <div class="replies" id="replies" style="margin-top:auto"></div>
    </div>
    <footer>
      <div class="input">
        <textarea id="msg" rows="1" placeholder="스레드에 답장"></textarea>
        <button class="send" id="send">보내기</button>
      </div>
    </footer>
  </section>
</div>

<script>
  const people = {
    me:    { name: "나",   color: "#87CBB9" },
    jiwoo: { name: "지우", color: "#c9b391" },
    hana:  { name: "하나", color: "#6B7280" },
    seo:   { name: "서진", color: "#7fb8a8" },
  };
  // 샘플 사진 자리는 그라데이션. at = 올린 시각
  const H = 3600e3, T0 = Date.now();
  const rooms = [
    { name: "우리 넷", threads: [
      { by: "jiwoo", at: T0 - 0.4 * H, time: "12:40", title: "퇴근길 하늘 미쳤다", unread: 2, archivable: true, tags: ["하늘", "합정"],
        photo: "linear-gradient(160deg,#f6c9a8,#e9a3a0 50%,#6B7280)",
        replies: [
          { by: "hana", time: "12:42", text: "어디야 이거?? 색감 뭐임", reacts: { "😮": 2 } },
          { by: "jiwoo", time: "12:43", text: "합정역 앞 육교", reacts: {} },
        ] },
      { by: "hana", at: T0 - 2 * H, time: "11:05", title: "토요일에 여기 갈 사람", unread: 1, archivable: true, tags: ["약속"],
        photo: "linear-gradient(170deg,#BFEFE0,#87CBB9 55%,#4d8d7d)",
        replies: [{ by: "jiwoo", time: "11:20", text: "나 토요일 가능", reacts: { "👍": 2 } }] },
      { by: "seo", at: T0 - 5 * H, time: "09:30", title: "오늘의 점심 평가 부탁", unread: 0, archivable: true, tags: ["점심"],
        photo: "linear-gradient(200deg,#F3EDE2,#D6C7B0 50%,#a88f6a)",
        replies: [
          { by: "me", time: "09:41", text: "7점. 김치가 부족해 보임", reacts: { "😂": 3 } },
          { by: "seo", time: "09:58", text: "김치 리필 무한이었음 다들 오해", reacts: { "😂": 1 } },
        ] },
      { by: "me", at: T0 - 30 * H, time: "어제", title: "고양이 근황", unread: 0, archivable: true, keptBy: "hana", tags: ["고양이"],
        photo: "linear-gradient(140deg,#e8e0d2,#b9ab95)",
        replies: [{ by: "hana", time: "어제", text: "볼살 실화냐", reacts: { "❤️": 3 } }] },
      { by: "jiwoo", at: T0 - 75 * H, time: "3일 전", title: "새로 산 키링", unread: 0, archivable: false, tags: ["득템"],
        photo: "linear-gradient(120deg,#BFEFE0,#F3EDE2)",
        replies: [{ by: "seo", time: "3일 전", text: "어디서 샀어 나도", reacts: {} }] },
    ] },
    { name: "가족", threads: [
      { by: "hana", at: T0 - 50 * H, time: "2일 전", title: "엄마가 보낸 김장 사진", unread: 0, archivable: true, keptBy: "me", tags: ["김장"],
        photo: "linear-gradient(150deg,#e9b7a2,#c98b72)",
        replies: [{ by: "me", time: "2일 전", text: "주말에 가지러 갈게", reacts: { "👍": 1 } }] },
    ] },
    { name: "회사 동기", threads: [] },
    { name: "지우", dm: "jiwoo", threads: [
      { by: "jiwoo", at: T0 - 1 * H, time: "12:10", title: "오늘 저녁 뭐 먹지?", color: "#D6C7B0", unread: 1, tags: ["저녁"],
        replies: [
          { by: "me", time: "12:15", text: "떡볶이 어때", reacts: {} },
          { by: "jiwoo", time: "12:16", text: "콜. 7시 역 앞", reacts: { "👍": 1 } },
        ] },
      { by: "me", at: T0 - 60 * H, time: "2일 전", title: "빌린 책 언제 줄까", color: "#87CBB9", unread: 0, tags: ["책"],
        replies: [{ by: "jiwoo", time: "2일 전", text: "다음 주에 만날 때!", reacts: {} }] },
    ] },
  ];
  let room = 0, threads = rooms[0].threads;
  const colors = ["#87CBB9", "#D6C7B0", "#6B7280", "#4f9a87"];
  // 사진이 없으면 단색 배경
  const bg = t => t.photo || `linear-gradient(${t.color}, ${t.color})`;
  const isDm = () => !!rooms[room].dm;
  // "내가 / 지우가 / 서진이가"
  const subj = id => id === "me" ? "내가" : people[id].name + ((people[id].name.at(-1).charCodeAt(0) - 0xAC00) % 28 ? "이가" : "가");
  const fresh = t => Date.now() - t.at < 24 * H;
  const hoursLeft = t => Math.max(1, Math.ceil(24 - (Date.now() - t.at) / H));

  const app = document.getElementById("app");
  const msg = document.getElementById("msg");
  let current = null;
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const av = id => `<span class="av" style="background:${people[id].color}">${people[id].name[0]}</span>`;
  const stack = t => {
    const ids = [...new Set([t.by, ...t.replies.map(r => r.by)])];
    return `<span class="stack">${ids.slice(0, 3).map(av).join("")}${ids.length > 3 ? `<small>+${ids.length - 3}</small>` : ""}</span>`;
  };
  const lastLine = t => {
    const r = t.replies[t.replies.length - 1];
    return r ? `${people[r.by].name}: ${esc(r.text)}` : "아직 답장이 없어요";
  };

  function renderHome() {
    const menu = document.getElementById("rooms");
    menu.innerHTML = "";
    rooms.forEach((r, k) => {
      const b = document.createElement("button");
      b.innerHTML = (r.dm ? av(r.dm) : "") + esc(r.name);
      if (k === room) b.className = "on";
      b.onclick = () => { room = k; threads = r.threads; renderHome(); };
      menu.appendChild(b);
    });

    // 1:1 방은 사라지지 않고 계속 쌓임
    const keep = isDm();
    const today = keep ? threads : threads.filter(fresh);
    const past = keep ? [] : threads.filter(t => !fresh(t) && t.keptBy);
    document.getElementById("allCount").textContent = past.length;
    document.getElementById("pastSec").hidden = keep;
    document.getElementById("all").hidden = keep;

    const rail = document.getElementById("hot");
    rail.innerHTML = today.length ? "" : `<div class="empty">오늘 올라온 이야기가 없어요. ＋로 첫 사진을 올려 보세요</div>`;
    today.forEach(t => {
      const b = document.createElement("button");
      b.className = "tcard photo" + (t.photo ? "" : " text");
      b.style.backgroundImage = `linear-gradient(#0000 35%, #0007), ${bg(t)}`;
      b.innerHTML = `
        <div class="who-row">${av(t.by)}
          <div><b>${people[t.by].name}</b><span class="sub">${t.time}</span></div>
          ${keep ? "" : `<span class="left">${hoursLeft(t)}시간 남음</span>`}</div>
        <h3>${esc(t.title)}</h3>
        <div class="last">${lastLine(t)}</div>
        <div class="foot">${keep ? "<span></span>" : stack(t)}
          ${t.keptBy && !keep ? `<span class="unread">📌</span>` : ""}
          ${t.unread ? `<span class="unread"><i></i>새 답장 ${t.unread}</span>` : ""}<span class="plus">＋</span></div>`;
      b.onclick = () => openThread(threads.indexOf(t));
      rail.appendChild(b);
    });

    const list = document.getElementById("all");
    list.innerHTML = past.length ? "" : `<div class="empty">누군가 보관한 이야기만 24시간 뒤에도 여기 남아요</div>`;
    past.forEach(t => {
      const b = document.createElement("button");
      b.className = "row";
      b.innerHTML = `<span class="thumb" style="background-image:${bg(t)}"></span>
        <div class="mid"><h4>${esc(t.title)}</h4><div class="last">${lastLine(t)}</div>
          <span class="pin">📌 ${subj(t.keptBy)} 보관함</span></div>
        <span class="time">${t.time}</span>`;
      b.onclick = () => openThread(threads.indexOf(t));
      list.appendChild(b);
    });
  }

  function renderThread() {
    const t = threads[current];
    document.getElementById("thread").style.backgroundImage = `linear-gradient(#0005, #0000 30%, #0000 55%, #0006), ${bg(t)}`;
    document.getElementById("bars").innerHTML = threads.map((_, k) => `<i class="${k <= current ? "on" : ""}"></i>`).join("");
    document.getElementById("tHead").innerHTML = `
      <div class="who-row">${av(t.by)}
        <div><b>${people[t.by].name}</b><span class="sub">${t.time} · 답장 ${t.replies.length}</span></div>
        <span style="margin-left:auto">${isDm() ? "" : stack(t)}</span></div>
      <h1>${esc(t.title)}</h1>
      ${t.ref ? `<div class="ref"><span class="thumb" style="background-image:${t.ref.bg}"></span>
        <div><span class="sub">${esc(t.ref.room)}에서</span><b>${esc(t.ref.title)}</b></div></div>` : ""}
      ${isDm() ? "" : t.archivable
        ? `<button class="keep-btn${t.keptBy ? " on" : ""}" id="keepBtn">📌 ${t.keptBy ? `${subj(t.keptBy)} 보관함` : "보관하기"}</button>`
        : `<span class="keep-note">올린 사람이 보관을 꺼 뒀어요 · 24시간 뒤 사라져요</span>`}
      ${!isDm() && t.by !== "me" ? `<button class="dm-btn" id="dmBtn">🔒 ${people[t.by].name}에게 따로 답장</button>` : ""}
      <div class="chips">${t.tags.map((g, k) => `<span class="chip${k ? "" : " on"}">#${esc(g)}</span>`).join("")}</div>`;
    const dmBtn = document.getElementById("dmBtn");
    if (dmBtn) dmBtn.onclick = () => replyPrivately(t);
    const keepBtn = document.getElementById("keepBtn");
    // 공유 보관: 누가 보관하든 방 전체에 남음. 보관한 사람만 해제 가능
    if (keepBtn) keepBtn.onclick = () => {
      if (!t.keptBy) t.keptBy = "me";
      else if (t.keptBy === "me") t.keptBy = null;
      renderThread();
    };
    const list = document.getElementById("replies");
    list.innerHTML = "";
    t.replies.forEach(r => {
      const d = document.createElement("div");
      d.className = "reply" + (r.by === "me" ? " me" : "");
      const reacts = Object.entries(r.reacts).map(([e, n]) =>
        `<button class="react${r.mine === e ? " on" : ""}" data-e="${e}">${e} ${n}</button>`).join("");
      d.innerHTML = `<span class="pill">${r.time}</span>
        <div class="bubble"><div class="who-row">${av(r.by)}<b>${people[r.by].name}</b></div>
          <p>${esc(r.text)}</p>
          <div class="reacts">${reacts}<button class="react" data-e="❤️">＋</button></div></div>`;
      d.querySelectorAll(".react").forEach(btn => btn.onclick = () => toggleReact(r, btn.dataset.e));
      list.appendChild(d);
    });
    const sc = document.getElementById("tScroll");
    sc.scrollTop = sc.scrollHeight;
  }

  function toggleReact(r, e) {
    if (r.mine) { r.reacts[r.mine]--; if (!r.reacts[r.mine]) delete r.reacts[r.mine]; }
    if (r.mine === e) r.mine = null;
    else { r.reacts[e] = (r.reacts[e] || 0) + 1; r.mine = e; }
    renderThread();
  }

  function openThread(i) { current = i; threads[i].unread = 0; renderThread(); app.classList.add("open"); }
  document.getElementById("back").onclick = () => { app.classList.remove("open"); renderHome(); };

  const now = () => new Date().toTimeString().slice(0, 5);
  function send() {
    const text = msg.value.trim();
    if (!text || current === null) return;
    threads[current].replies.push({ by: "me", time: now(), text, reacts: {} });
    msg.value = ""; msg.style.height = "auto";
    renderThread();
  }
  document.getElementById("send").onclick = send;
  msg.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  msg.addEventListener("input", () => { msg.style.height = "auto"; msg.style.height = msg.scrollHeight + "px"; });

  const pickColor = () => colors[Math.floor(Math.random() * colors.length)];

  // 그룹 스레드에서 작성자와의 1:1 방으로 따로 답장
  function replyPrivately(t) {
    let k = rooms.findIndex(r => r.dm === t.by);
    if (k < 0) { rooms.push({ name: people[t.by].name, dm: t.by, threads: [] }); k = rooms.length - 1; }
    const ref = { bg: bg(t), title: t.title, room: rooms[room].name };
    room = k; threads = rooms[k].threads;
    threads.unshift({ by: "me", at: Date.now(), time: now(), title: `"${t.title}"에 답장`, color: pickColor(),
      unread: 0, tags: ["따로 답장"], ref, replies: [] });
    renderHome();
    openThread(0);
    msg.focus();
  }

  // 새 스레드: 글만, 또는 사진과 함께
  const sheet = document.getElementById("sheet");
  const draft = document.getElementById("draft");
  const picked = document.getElementById("picked");
  const file = document.getElementById("file");
  let pickedUrl = null;
  function toggleSheet(open) {
    sheet.hidden = !open;
    document.getElementById("upload").setAttribute("aria-expanded", open);
    if (open) draft.focus();
  }
  document.getElementById("upload").onclick = () => toggleSheet(sheet.hidden);
  document.getElementById("pick").onclick = () => file.click();
  file.onchange = () => {
    const f = file.files[0];
    if (!f) return;
    pickedUrl = URL.createObjectURL(f);
    picked.style.backgroundImage = `url(${pickedUrl})`;
    picked.hidden = false;
    file.value = "";
  };
  document.getElementById("post").onclick = () => {
    const title = draft.value.trim();
    if (!title && !pickedUrl) { draft.focus(); return; }
    threads.unshift({ by: "me", at: Date.now(), time: now(), title: title || "새 사진", unread: 0, tags: ["새 스레드"],
      photo: pickedUrl ? `url(${pickedUrl})` : null, color: pickColor(), replies: [],
      archivable: document.getElementById("allowKeep").checked });
    draft.value = ""; pickedUrl = null; picked.hidden = true;
    toggleSheet(false);
    renderHome();
    openThread(0);
  };

  renderHome();
</script>
</body>
</html>
