<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PatPat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 꽉 채운 직사각형 그리드. 모서리·그림자 없이 1px 선으로만 구분 */
  :root {
    --mint: #BFEFE0;
    --teal: #87CBB9;
    --deep: #4f9a87;
    --sand: #D6C7B0;
    --cream: #22252a;   /* 칩·보조 면 */
    --slate: #9ba1a8;   /* 보조 글씨 */
    --ink: #f4f4f5;     /* 본문 글씨 */
    --paper: #0e0f11;   /* 바탕 */
    --surface: #17191c; /* 카드·입력 면 */
    --line: #2a2d32;
    --on-light: #2f3440; /* 밝은 면 위 글씨 */
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Noto Sans KR", system-ui, sans-serif; letter-spacing: -0.02em;
    display: flex; justify-content: center; overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; border-radius: 0; }
  :focus-visible { outline: 2px solid var(--deep); outline-offset: -2px; }
  .app { position: relative; width: 100%; max-width: 480px; height: 100%; overflow: hidden; background: var(--paper); border-inline: 1px solid var(--line); }
  .view { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--paper); transition: transform .28s ease; }
  .thread { transform: translateX(100%); }
  .app.open .thread { transform: none; }
  .app.open .home { transform: translateX(-25%); }
  .mine { transform: translateX(-100%); }
  .app.mine-open .mine { transform: none; }
  .app.mine-open .home { transform: translateX(25%); }
  .scroll { flex: 1; overflow-y: auto; }

  /* 상단 */
  .top { display: flex; align-items: center; justify-content: space-between; padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 6px; }
  .me-btn { width: 32px; height: 32px; font-size: 13px !important; border-radius: 50%; background: var(--teal); color: #fff; display: grid; place-items: center; font-size: 15px; font-weight: 500; }
  .icon-btn { width: 32px; height: 32px; display: grid; place-items: center; color: var(--ink); }
  .icon-btn svg, .new svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
  .seg { display: flex; gap: 2px; padding: 2px; border-radius: 999px; background: var(--surface); }
  .seg button { padding: 5px 14px; border-radius: 999px; color: var(--slate); }
  .seg svg { display: block; width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
  .seg button.on { background: var(--cream); color: var(--ink); }
  .tabs { display: flex; align-items: center; gap: 2px; padding: 4px 0 12px 12px; }
  .new { width: 32px; height: 32px; flex: none; display: grid; place-items: center; color: var(--ink); }
  .new[aria-expanded="true"] { color: var(--teal); }
  .rooms { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; padding: 0 16px 0 2px; }
  .rooms::-webkit-scrollbar { display: none; }
  .rooms button {
    flex: none; white-space: nowrap; font-size: 13px; padding: 6px 13px; border-radius: 999px;
    background: var(--surface); color: var(--slate); display: flex; align-items: center; gap: 6px;
  }
  .rooms button.on { background: var(--ink); color: var(--paper); font-weight: 700; }

  .av {
    width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center;
    font-size: 12px; font-weight: 500; color: #fff; flex: none;
  }
  .av.s { width: 20px; height: 20px; font-size: 10px; }
  .stack { display: flex; }
  .stack .av { margin-left: -6px; border: 2px solid #fff6; box-sizing: content-box; }
  .stack .av:first-child { margin-left: 0; }

  /* 작성 */
  .sheet { border-bottom: 1px solid var(--line); background: var(--surface); }
  .sheet textarea { display: block; width: 100%; padding: 14px 16px; min-height: 72px; }
  .sheet-row { display: flex; flex-wrap: wrap; border-top: 1px solid var(--line); }
  .sheet-row > * { height: 40px; border-right: 1px solid var(--line); font-size: 13px; color: var(--slate); }
  .sheet-row .picked { width: 40px; background-size: cover; background-position: center; }
  .sheet-row label { display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; }
  .sheet-row input { accent-color: var(--deep); }
  .sheet-row button.ghost { padding: 0 12px; }
  .sheet-row .send { margin-left: auto; border-right: 0; }
  select { font: inherit; font-size: 13px; color: var(--slate); border: 0; background: none; padding: 0 10px; border-radius: 0; }
  textarea, .now input {
    border: 0; outline: 0; resize: none; background: none; font: inherit; font-size: 15px; color: var(--ink); line-height: 1.5;
  }
  .send { background: var(--ink); color: var(--paper); font-size: 14px; font-weight: 500; padding: 0 18px; }

  /* 홈: 큰 대표 스토리 + 주제별 가로 줄 */
  .hero {
    position: relative; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px;
    width: calc(100% - 32px); margin: 0 16px; aspect-ratio: 16 / 10; max-height: 260px; padding: 16px; text-align: left; color: #fff;
    background-size: cover; background-position: center;
  }
  .hero .kicker { font-size: 12px; color: #ffffffcc; display: flex; align-items: center; gap: 6px; }
  .hero h2 { font-size: 22px; font-weight: 700; line-height: 1.2; letter-spacing: -0.03em; text-wrap: balance; }
  .hero .last { font-size: 13px; color: #ffffffd9; }
  .hero-btns { height: 0; }
  .hero h2, .hero .last { padding-right: 52px; }
  .reply-ic { position: absolute; right: 16px; bottom: 16px; width: 40px; height: 40px; border-radius: 50%; background: #fff; color: #111; display: grid; place-items: center; }
  .reply-ic svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
  .dot {
    position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px;
    background: #ff4d4f; color: #fff; font-size: 11px; font-weight: 700; font-style: normal; display: grid; place-items: center;
    border: 2px solid var(--paper); text-shadow: none; font-variant-numeric: tabular-nums;
  }
  .row-hd { display: flex; align-items: baseline; gap: 8px; padding: 22px 16px 10px; }
  .row-hd h3 { font-size: 17px; font-weight: 700; }
  .row-hd span { font-size: 12px; color: var(--slate); }
  .row-list { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px; scroll-snap-type: x mandatory; scroll-padding-inline: 16px; }
  .row-list::-webkit-scrollbar { display: none; }
  .pcard {
    position: relative; flex: none; width: 150px; aspect-ratio: 1 / 1; background-size: cover; background-position: center;
    color: #fff; text-align: left; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; gap: 2px;
    scroll-snap-align: start; text-shadow: 0 1px 3px #000a;
  }
  .pcard h4 { font-size: 14px; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pcard .meta { font-size: 11px; color: #ffffffcc; display: flex; align-items: center; gap: 4px; }
  .pcard .badge { position: absolute; top: 0; left: 0; font-size: 11px; font-weight: 700; padding: 3px 7px; background: var(--deep); text-shadow: none; }
  .pcard .badge.pin { background: #000a; }
  .pcard .time-left { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #ffffff33; }
  .pcard .time-left i { display: block; height: 100%; background: var(--teal); }
  .home-empty { padding: 60px 24px; text-align: center; color: var(--slate); font-size: 14px; line-height: 1.6; }
  /* (이전) 가로 사진 카드 */
  .rail { display: flex; gap: 10px; overflow-x: auto; padding: 4px 20px 8px; scroll-snap-type: x mandatory; scroll-padding-inline: 20px; }
  .rail::-webkit-scrollbar { display: none; }
  .tcard {
    flex: none; width: 230px; min-height: 260px; padding: 16px; color: #fff; text-align: left;
    background-size: cover; background-position: center; scroll-snap-align: start;
    display: flex; flex-direction: column; gap: 10px; text-shadow: 0 1px 3px #000c, 0 0 12px #0008;
  }
  .tcard .who-row { margin-bottom: auto; }
  .tcard .who-row b { display: block; font-size: 13px; }
  .tcard .sub, .tcard .last { color: #ffffffd9; font-size: 11px; }
  .tcard .last { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tcard h3 { font-size: 18px; font-weight: 700; line-height: 1.3; text-shadow: 0 1px 6px #0004; }
  .tcard.text h3 { font-size: 22px; text-shadow: none; }
  .tcard .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .left { font-size: 11px; padding: 3px 8px; background: #0000004d; margin-left: auto; align-self: flex-start; }
  .unread { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; }
  .unread i { width: 7px; height: 7px; border-radius: 50%; background: #f0a58a; }
  .plus { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid currentColor; display: grid; place-items: center; font-size: 18px; line-height: 1; }
  .empty { padding: 28px 16px; font-size: 13px; color: var(--slate); flex: 1; border: 1px dashed var(--sand); }
  #all .empty { border: 0; }

  .sec { display: flex; align-items: baseline; gap: 8px; padding: 22px 16px 8px; border-bottom: 1px solid var(--line); }
  .sec h2 { font-size: 12px; font-weight: 500; color: var(--slate); letter-spacing: 0.06em; text-transform: uppercase; }
  .sec span { font-size: 12px; color: var(--slate); }
  .row { display: flex; gap: 12px; width: 100%; padding: 10px 16px; border-bottom: 1px solid var(--line); text-align: left; align-items: center; }
  .thumb { width: 48px; height: 48px; flex: none; background-size: cover; background-position: center; }
  .row .mid { flex: 1; min-width: 0; }
  .row h4 { font-size: 14px; font-weight: 500; }
  .row .last, .row .pin { font-size: 12px; color: var(--slate); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .time { font-size: 11px; color: var(--slate); align-self: flex-start; }

  /* 지도 */
  .map-wrap { position: relative; aspect-ratio: 4 / 5; max-width: 100%; background: #15171a; border-bottom: 1px solid var(--line); overflow: hidden; }
  .map-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map-wrap svg text { font-family: inherit; font-size: 3.2px; fill: var(--slate); }
  .mk { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 0; text-align: left; }
  .mk .ph { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--ink); box-shadow: 0 3px 10px #0002; background-size: cover; background-position: center; flex: none; }
  .mk .tag { display: flex; flex-direction: column; font-size: 11px; padding: 4px 8px; background: var(--surface); color: var(--ink); white-space: nowrap; max-width: 150px; border: 1px solid var(--line); border-radius: 12px; margin-left: 4px; }
  .mk .tag span { overflow: hidden; text-overflow: ellipsis; }
  .mk .song { color: var(--deep); font-size: 10px; }
  .mk .av { width: 32px; height: 32px; border: 2px solid #fff; box-sizing: content-box; box-shadow: 0 3px 8px #0002; }
  .mk.me .tag { background: var(--deep); }
  .mk.with .av { outline: 2px solid var(--deep); }
  .now { display: flex; border-bottom: 1px solid var(--line); background: var(--surface); min-height: 44px; }
  .now input { flex: 1; min-width: 0; padding: 0 16px; font-size: 14px; }
  .now select { border-left: 1px solid var(--line); }
  .music-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--slate); }
  .music-row b { color: var(--ink); font-weight: 500; }
  .switch { margin-left: auto; width: 40px; height: 22px; background: var(--line); position: relative; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; background: #fff; transition: left .2s; }
  .switch[aria-pressed="true"] { background: var(--deep); }
  .switch[aria-pressed="true"]::after { left: 21px; }
  .map-note { font-size: 11px; color: var(--slate); padding: 10px 16px 24px; }

  /* 같이 듣기 패널 */
  .listen { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); color: #fff; z-index: 5; animation: up .25s ease; }
  .listen .hd { display: flex; gap: 12px; padding: 14px 16px; align-items: center; }
  .cover { width: 56px; height: 56px; flex: none; }
  .listen .info { flex: 1; min-width: 0; }
  .listen .info b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .listen .info span { font-size: 12px; color: #ffffffaa; }
  .listen .x { width: 32px; height: 32px; color: #ffffffaa; font-size: 18px; align-self: flex-start; }
  .bar { height: 2px; background: #ffffff33; margin: 0 16px; }
  .bar i { display: block; height: 100%; background: var(--teal); }
  .times { display: flex; justify-content: space-between; font-size: 11px; color: #ffffff88; padding: 6px 16px 0; font-variant-numeric: tabular-nums; }
  .listen .ft { display: flex; align-items: center; gap: 8px; padding: 12px 16px 16px; font-size: 12px; color: #ffffffcc; }
  .listen .join { margin-left: auto; height: 38px; padding: 0 18px; background: var(--mint); color: var(--on-light); font-weight: 700; font-size: 13px; }
  .listen .join.on { background: transparent; color: #fff; border: 1px solid #ffffff55; }
  .listen .src { font-size: 10px; color: #ffffff66; padding: 0 16px 10px; }

  /* 스레드: 사진이 화면 전체 */
  .thread { color: #fff; background-color: var(--slate); background-size: cover; background-position: center; }
  .bars { display: flex; gap: 2px; padding: 8px 8px 0; }
  .bars i { flex: 1; height: 2px; background: #fff6; }
  .bars i.on { background: #fff; }
  .thread .top { padding: 0; }
  .thread .top button { width: 52px; height: 52px; font-size: 20px; }
  .t-head { padding: 0 16px 14px; }
  .who-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .who-row .sub { font-size: 12px; opacity: .8; }
  .t-head h1 { font-size: 24px; font-weight: 700; margin-top: 10px; line-height: 1.3; text-shadow: 0 1px 8px #0005; }
  .t-meta { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 12px; }
  .t-meta > * { font-size: 12px; padding: 6px 10px; background: #0000004d; backdrop-filter: blur(8px); }
  .t-meta button.on { background: #fff; color: var(--on-light); }
  .ref { display: flex; align-items: center; gap: 8px; }
  .ref .thumb { width: 24px; height: 24px; }
  .replies { display: flex; flex-direction: column; gap: 2px; margin-top: auto; }
  .reply { display: grid; grid-template-columns: 52px 1fr; color: #fff; text-shadow: 0 1px 4px #000c; animation: rise .3s ease both; }
  .reply.me .who { color: var(--teal); }
  .reply .tm { font-size: 11px; color: #ffffff8c; padding: 12px 0 0 12px; font-variant-numeric: tabular-nums; }
  .reply .body { padding: 10px 14px 4px 0; min-width: 0; }
  .reply.cont .body { padding-top: 0; }
  .reply.me p { color: var(--mint); }
  .reply .who { font-size: 12px; color: #ffffffb3; display: flex; align-items: center; gap: 6px; }
  .reply p { font-size: 15px; line-height: 1.5; margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
  .reacts { display: flex; gap: 2px; margin-top: 6px; flex-wrap: wrap; }
  .react { font-size: 12px; padding: 2px 6px 2px 0; color: #ffffffb3; }
  .react.on { color: var(--teal); }
  .thread footer { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 12px 10px; }
  .thread footer textarea { color: #fff; border-bottom: 1px solid #ffffff59; }
  .thread footer textarea::placeholder { color: #ffffff8c; }
  .thread footer .send { height: 36px; border-radius: 999px; background: #fff; color: #111; }
  .thread footer textarea { flex: 1; padding: 14px 16px; max-height: 120px; }

  /* 내 홈 */
  .mine .top { padding: 0 8px 0 0; }
  .mine .top .back { width: 52px; height: 52px; font-size: 20px; }
  .mine .top h1 { flex: 1; font-size: 17px; font-weight: 700; }
  .owners { display: flex; gap: 14px; padding: 4px 20px 12px; overflow-x: auto; border-bottom: 1px solid var(--line); }
  .owners button { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--slate); flex: none; }
  .owners .av { width: 44px; height: 44px; font-size: 15px; border: 2px solid transparent; box-sizing: content-box; }
  .owners button.on { color: var(--ink); font-weight: 700; }
  .owners button.on .av { border-color: var(--deep); }
  .homes { display: flex; gap: 8px; overflow-x: auto; padding: 10px 20px 0; }
  .homes button { flex: none; font-size: 13px; padding: 6px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--slate); }
  .homes button.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .viewers { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 10px 20px 12px; font-size: 12px; color: var(--slate); }
  .viewers button { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px 3px 3px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); opacity: .55; }
  .viewers button.on { opacity: 1; border-color: var(--deep); color: var(--ink); }
  /* 미니홈피 */
  .cy { display: flex; flex-direction: column; gap: 8px; padding: 12px; background: var(--paper); }
  .cy-profile { display: flex; align-items: center; gap: 16px; padding: 8px 6px 4px; }
  .cy-pic { width: 76px; height: 76px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 28px; color: #fff; }
  .cy-info { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .cy-info strong { font-size: 19px; letter-spacing: -0.03em; }
  .cy-info p { font-size: 13px; color: var(--slate); }
  .cy-today { align-self: flex-start; margin-top: 6px; font-size: 11px; color: var(--slate); padding: 3px 9px; border-radius: 999px; background: var(--cream); font-variant-numeric: tabular-nums; }
  .cy-today b { color: var(--deep); font-weight: 700; }
  .cy-stats { display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 0 4px; }
  .cy-stats span { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--slate); }
  .cy-stats b { font-size: 17px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  .cy-room-hd { display: flex; align-items: baseline; justify-content: space-between; padding: 10px 14px 8px; }
  .cy-room-hd b { font-size: 13px; color: var(--deep); font-style: italic; }
  .cy-room-hd span { font-size: 11px; color: var(--slate); }
  .skin-btn { font-size: 12px; padding: 5px 12px; border-radius: 999px; background: var(--ink); color: var(--paper); }
  .board { position: relative; aspect-ratio: 1 / 1; max-width: 100%; overflow: hidden; touch-action: none; background: radial-gradient(circle at 50% 45%, #23262b, var(--paper) 75%); }
  .board canvas { display: block; width: 100%; height: 100%; }
  .item { position: absolute; transform: translate(-50%, -50%) rotate(var(--r)); user-select: none; }
  .item.mine-item { cursor: grab; }
  .item.memo { width: 120px; padding: 10px 10px 8px; font-size: 13px; line-height: 1.45; color: var(--on-light); box-shadow: 0 4px 10px #6b728026; }
  .item.memo .by { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--slate); margin-top: 6px; }
  .item.sticker { font-size: 42px; line-height: 1; filter: drop-shadow(0 3px 4px #0002); }
  .locked { padding: 60px 20px; text-align: center; color: var(--slate); font-size: 14px; }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 8px 10px; border-top: 1px solid var(--line); }
  .tools .emo { font-size: 21px; width: 34px; height: 34px; border-radius: 50%; }
  .tools .emo:hover { background: var(--cream); }
  .tools .memo-btn { margin-left: auto; height: 36px; padding: 0 14px; background: var(--deep); color: #fff; font-size: 13px; }
  .memo-form { display: flex; align-items: stretch; border-top: 1px solid var(--line); }
  .memo-form textarea { flex: 1; padding: 12px 16px; font-size: 14px; }
  .memo-form .colors { display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 8px; }
  .memo-form .colors button { width: 18px; height: 18px; border: 2px solid transparent; }
  .memo-form .colors button.on { border-color: var(--ink); }
  .hint { font-size: 11px; color: var(--slate); padding: 10px 20px 24px; }

  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  @keyframes up { from { transform: translateY(100%); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <section class="view home">
    <div class="top">
      <button class="me-btn" id="meBtn" aria-label="내 홈">나</button>
      <div class="seg" id="seg">

    <div class="tabs">
      <button class="new" id="upload" aria-label="새 스레드 시작" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

    <div class="scroll">

            <path d="M10 0 L 30 125 M 0 40 L 100 30 M 55 0 L 62 80 M 0 64 L 100 58 M 75 0 L 92 125" stroke="#3a3e44" stroke-width=".6" fill="none"/>

          <div class="cy-room-hd"><b>Mini Room</b><span id="roomNote">방명록 메모 · 스티커</span>
            <button class="skin-btn" id="skinBtn">사진으로 옷 입히기</button>
            <input type="file" id="skinFile" accept="image/*" capture="environment" hidden></div>

    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  const people = {
    me:    { name: "나",   color: "#87CBB9" },
    jiwoo: { name: "지우", color: "#c9b391" },
    hana:  { name: "하나", color: "#6B7280" },
    seo:   { name: "서진", color: "#7fb8a8" },
  };
  // 샘플 사진 자리는 그라데이션. at = 올린 시각
  const H = 3600e3, T0 = Date.now();
  const rooms = [
    { name: "우리 넷", members: ["jiwoo", "hana", "seo"], threads: [
      { by: "jiwoo", at: T0 - 0.4 * H, time: "12:40", title: "퇴근길 하늘 미쳤다", place: "합정", showDist: true, unread: 2, archivable: true,
        photo: "url(assets/sky.webp)",
        replies: [
          { by: "hana", time: "12:42", text: "어디야 이거?? 색감 뭐임", reacts: { "😮": 2 } },
          { by: "jiwoo", time: "12:43", text: "합정역 앞 육교", reacts: {} },
        ] },
      { by: "hana", at: T0 - 2 * H, time: "11:05", title: "토요일에 여기 갈 사람", place: "성수", unread: 1, archivable: true,
        photo: "url(assets/gmf.webp)",
        replies: [{ by: "jiwoo", time: "11:20", text: "나 토요일 가능", reacts: { "👍": 2 } }] },
      { by: "seo", at: T0 - 5 * H, time: "09:30", title: "오늘의 점심 평가 부탁", place: "여의도", showDist: true, unread: 0, archivable: true,
        photo: "url(assets/lunch.webp)",
        replies: [
          { by: "me", time: "09:41", text: "7점. 김치가 부족해 보임", reacts: { "😂": 3 } },
          { by: "seo", time: "09:58", text: "김치 리필 무한이었음 다들 오해", reacts: { "😂": 1 } },
        ] },
      { by: "me", at: T0 - 30 * H, time: "어제", title: "고양이 근황", unread: 0, archivable: true, keptBy: "hana",
        photo: "url(assets/cat.webp)",
        replies: [{ by: "hana", time: "어제", text: "볼살 실화냐", reacts: { "❤️": 3 } }] },
      { by: "jiwoo", at: T0 - 75 * H, time: "3일 전", title: "새로 산 키링", unread: 0, archivable: false,
        photo: "linear-gradient(120deg,#BFEFE0,#F3EDE2)",
        replies: [{ by: "seo", time: "3일 전", text: "어디서 샀어 나도", reacts: {} }] },
    ] },
    { name: "가족", members: ["hana"], threads: [
      { by: "hana", at: T0 - 50 * H, time: "2일 전", title: "엄마가 보낸 김장 사진", unread: 0, archivable: true, keptBy: "me",
        photo: "url(assets/kimjang.webp)",
        replies: [{ by: "me", time: "2일 전", text: "주말에 가지러 갈게", reacts: { "👍": 1 } }] },
    ] },
    { name: "회사 동기", threads: [] },
    { name: "지우", dm: "jiwoo", threads: [
      { by: "jiwoo", at: T0 - 1 * H, time: "12:10", title: "오늘 저녁 뭐 먹지?", photo: "url(assets/dinner.webp)", unread: 1,
        replies: [
          { by: "me", time: "12:15", text: "떡볶이 어때", reacts: {} },
          { by: "jiwoo", time: "12:16", text: "콜. 7시 역 앞", reacts: { "👍": 1 } },
        ] },
      { by: "me", at: T0 - 60 * H, time: "2일 전", title: "빌린 책 언제 줄까", photo: "url(assets/books.webp)", unread: 0,
        replies: [{ by: "jiwoo", time: "2일 전", text: "다음 주에 만날 때!", reacts: {} }] },
    ] },
  ];
  let room = 0, threads = rooms[0].threads;

  // 동네 단위 위치 (지도 좌표: 100 x 125)
  const places = {
    "망원": { x: 24, y: 44, lat: 37.5560, lng: 126.9105 }, "합정": { x: 28, y: 68, lat: 37.5496, lng: 126.9139 },
    "홍대": { x: 52, y: 56, lat: 37.5571, lng: 126.9245 }, "연남": { x: 40, y: 24, lat: 37.5622, lng: 126.9230 },
    "신촌": { x: 72, y: 38, lat: 37.5551, lng: 126.9368 }, "여의도": { x: 48, y: 112, lat: 37.5219, lng: 126.9245 },
    "성수": { x: 78, y: 70, lat: 37.5446, lng: 127.0560 },
  };
  // 나와의 거리: 동네 중심끼리 계산하므로 "약"으로 표시. 내 위치는 내 상태의 동네(없으면 홍대)
  function distLabel(place) {
    if (!place || !places[place]) return "";
    const mine = (statuses.me && statuses.me.place) || "홍대";
    if (place === mine) return "같은 동네";
    const a = places[mine], b = places[place], R = 6371e3, rad = Math.PI / 180;
    const h = Math.sin((b.lat - a.lat) * rad / 2) ** 2 +
      Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin((b.lng - a.lng) * rad / 2) ** 2;
    const m = 2 * R * Math.asin(Math.sqrt(h));
    return m < 1000 ? `약 ${Math.round(m / 100) * 100}m` : `약 ${(m / 1000).toFixed(1)}km`;
  }
  // 예시 곡 (Spotify 연결 전)
  const tracks = {
    nanchun:  { title: "난춘", artist: "새소년", dur: 263, cover: "linear-gradient(135deg,#e9a3a0,#6B7280)" },
    everything: { title: "Everything", artist: "검정치마", dur: 254, cover: "linear-gradient(135deg,#2f3440,#87CBB9)" },
    hype:     { title: "Hype Boy", artist: "NewJeans", dur: 179, cover: "linear-gradient(135deg,#BFEFE0,#9fc5e8)" },
  };
  // 지금 뭐 해: 사람별 최신 상태 하나. song = 곡과 재생 시작 시각
  const statuses = {
    jiwoo: { text: "☕ 카공 중", place: "연남", at: T0 - 0.5 * H, song: { id: "everything", from: T0 - 80e3 } },
    hana:  { text: "🏃 한강 러닝", place: "망원", at: T0 - 1 * H, song: { id: "hype", from: T0 - 30e3 } },
    seo:   { text: "📚 도서관", place: "신촌", at: T0 - 3 * H },
  };
  let listeningTo = null; // 같이 듣는 친구
  let sharing = false;    // 내 노래 공유

  const app = document.getElementById("app");
  const msg = document.getElementById("msg");
  let current = null;
  const colors = ["#87CBB9", "#D6C7B0", "#6B7280", "#4f9a87"];
  // 사진이 없으면 단색 배경
  const bg = t => t.photo || `linear-gradient(${t.color}, ${t.color})`;
  const isDm = () => !!rooms[room].dm;
  // "내가 / 지우가 / 서진이가"
  const subj = id => id === "me" ? "내가" : people[id].name + ((people[id].name.at(-1).charCodeAt(0) - 0xAC00) % 28 ? "이가" : "가");
  const fresh = t => Date.now() - t.at < 24 * H;
  const hoursLeft = t => Math.max(1, Math.ceil(24 - (Date.now() - t.at) / H));
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const av = (id, cls = "") => `<span class="av ${cls}" style="background:${people[id].color}">${people[id].name[0]}</span>`;
  const stack = t => {
    const ids = [...new Set([t.by, ...t.replies.map(r => r.by)])];
    return `<span class="stack">${ids.slice(0, 3).map(id => av(id, "s")).join("")}</span>`;
  };
  const lastLine = t => {
    const r = t.replies[t.replies.length - 1];
    return r ? `${people[r.by].name}: ${esc(r.text)}` : "아직 답장이 없어요";
  };
  const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  const now = () => new Date().toTimeString().slice(0, 5);

  function renderHome() {
    const menu = document.getElementById("rooms");
    menu.innerHTML = "";
    rooms.forEach((r, k) => {
      const b = document.createElement("button");
      b.innerHTML = (r.dm ? av(r.dm, "s") : "") + esc(r.name);
      if (k === room) b.className = "on";
      b.onclick = () => { room = k; threads = r.threads; renderHome(); };
      menu.appendChild(b);
    });

    // 1:1 방은 사라지지 않고 계속 쌓임
    const keep = isDm();
    const today = keep ? threads : threads.filter(fresh);
    const past = keep ? [] : threads.filter(t => !fresh(t) && t.keptBy);

    // 대표 스토리: 새 답장이 있는 것 > 가장 최근 것
    const lead = today.find(t => t.unread) || today[0] || past[0];
    const hero = document.getElementById("hero");
    hero.innerHTML = "";
    if (!lead) {
      hero.innerHTML = `<div class="home-empty">아직 이야기가 없어요.<br>＋로 첫 사진이나 글을 올려 보세요</div>`;
    } else {
      const b = document.createElement("button");
      b.className = "hero";
      b.style.backgroundImage = `linear-gradient(#0000 30%, #000c), ${bg(lead)}`;
      b.innerHTML = `
        <div class="kicker">${av(lead.by, "s")}${people[lead.by].name}${lead.place ? ` · ${esc(lead.place)}` : ""}${lead.showDist ? ` · ${distLabel(lead.place)}` : ""} · ${keep || !fresh(lead) ? lead.time : `${hoursLeft(lead)}시간 남음`}</div>
        <h2>${esc(lead.title)}</h2>
        <div class="last">${lastLine(lead)}</div>
        <div class="hero-btns"><span class="reply-ic" aria-label="답장 ${lead.replies.length}개${lead.unread ? `, 새 답장 ${lead.unread}개` : ""}">
          <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>${lead.unread ? `<i class="dot">${lead.unread}</i>` : ""}</span></div>`;
      b.onclick = () => openThread(threads.indexOf(lead));
      hero.appendChild(b);
    }

    // 주제별 가로 줄
    const rows = keep
      ? [["이야기", today]]
      : [["새 답장이 왔어요", today.filter(t => t.unread)], ["오늘의 이야기", today], ["History", past]];
    const box = document.getElementById("rowsBox");
    box.innerHTML = "";
    rows.filter(([, list]) => list.length).forEach(([name, list]) => {
      const sec = document.createElement("section");
      sec.innerHTML = `<div class="row-hd"><h3>${name}</h3><span>${list.length}</span></div><div class="row-list"></div>`;
      list.forEach(t => {
        const b = document.createElement("button");
        b.className = "pcard";
        b.style.backgroundImage = `linear-gradient(#0000 45%, #000c), ${bg(t)}`;
        const left = !keep && fresh(t) ? Math.max(0, 1 - (Date.now() - t.at) / (24 * H)) : null;
        b.innerHTML = `
          ${t.unread ? `<i class="dot" style="top:6px;right:6px">${t.unread}</i>` : t.keptBy && !keep ? `<span class="badge pin">보관</span>` : ""}
          <h4>${esc(t.title)}</h4>
          <div class="meta">${people[t.by].name} · ${t.showDist ? distLabel(t.place) : t.time}</div>
          ${left !== null ? `<span class="time-left"><i style="width:${left * 100}%"></i></span>` : ""}`;
        b.onclick = () => openThread(threads.indexOf(t));
        sec.querySelector(".row-list").appendChild(b);
      });
      box.appendChild(sec);
    });
    renderMap();
  }

  function renderMap() {
    const map = document.getElementById("map");
    map.querySelectorAll(".mk").forEach(e => e.remove());
    const svg = map.querySelector("svg");
    svg.querySelectorAll("text").forEach(e => e.remove());
    Object.entries(places).forEach(([n, p]) => {
      const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
      t.setAttribute("x", p.x); t.setAttribute("y", p.y + 9); t.setAttribute("text-anchor", "middle");
      t.textContent = n;
      svg.appendChild(t);
    });
    const put = (el, place, dy = 0) => {
      const p = places[place];
      el.style.left = `${p.x}%`;
      el.style.top = `calc(${p.y / 1.25}% + ${dy}px)`;
      map.appendChild(el);
    };
    // 오늘 올라온 스토리 중 위치가 붙은 것
    threads.filter(t => t.place && fresh(t)).forEach(t => {
      const b = document.createElement("button");
      b.className = "mk";
      b.innerHTML = `<span class="ph" style="background-image:${bg(t)}"></span><span class="tag"><span>${esc(t.title)}</span></span>`;
      b.onclick = () => openThread(threads.indexOf(t));
      put(b, t.place);
    });
    // 이 방 사람들의 상태
    const r = rooms[room];
    const who = [...(r.members || (r.dm ? [r.dm] : [])), "me"];
    who.filter(id => statuses[id] && fresh(statuses[id])).forEach(id => {
      const st = statuses[id];
      const song = songOf(id);
      const el = document.createElement(song && id !== "me" ? "button" : "div");
      el.className = "mk" + (id === "me" ? " me" : "") + (listeningTo === id ? " with" : "");
      el.innerHTML = `${av(id)}<span class="tag"><span>${esc(st.text)}</span>${song ? `<span class="song">${esc(song.title)} · ${esc(song.artist)}</span>` : ""}</span>`;
      if (song && id !== "me") el.onclick = () => openListen(id);
      const busy = threads.some(t => t.place === st.place && fresh(t));
      put(el, st.place, busy ? -48 : 0);
    });
  }

  // 같이 듣는 중이면 친구 곡을 그대로 따라감
  function songOf(id) {
    if (id === "me") {
      if (listeningTo) return songOf(listeningTo);
      return sharing ? tracks.nanchun : null;
    }
    const s = statuses[id] && statuses[id].song;
    return s ? tracks[s.id] : null;
  }
  function songPos(id) {
    const s = statuses[id].song;
    return ((Date.now() - s.from) / 1000) % tracks[s.id].dur;
  }

  let openId = null, ticker = null;
  function openListen(id) {
    openId = id;
    const t = songOf(id);
    document.getElementById("lCover").style.background = t.cover;
    document.getElementById("lTitle").textContent = t.title;
    document.getElementById("lArtist").textContent = t.artist;
    document.getElementById("lDur").textContent = mmss(t.dur);
    document.getElementById("listen").hidden = false;
    renderListen();
    clearInterval(ticker);
    ticker = setInterval(tick, 500);
    tick();
  }
  function renderListen() {
    const together = listeningTo === openId;
    const ids = together ? [openId, "me"] : [openId];
    document.getElementById("lWho").innerHTML = ids.map(i => av(i, "s")).join("");
    document.getElementById("lWhoText").textContent = together ? `${people[openId].name}랑 같이 듣는 중` : `${subj(openId)} 듣는 중`;
    const j = document.getElementById("lJoin");
    j.textContent = together ? "그만 듣기" : "같이 듣기";
    j.classList.toggle("on", together);
  }
  function tick() {

  const homes = {

      <span><b>${memos}</b>방명록</span><span><b>${home.items.length - memos}</b>스티커</span>`;

  // 3D 미니룸: 벽 두 면 + 바닥. 메모는 뒷벽에, 스티커는 바닥에, 캐릭터는 방 안을 돌아다님
  const room3d = (() => {
    if (!window.THREE) return { show() {}, applySkin() {}, start() {}, stop() {} };
    const T = THREE, board = document.getElementById("board");
    const renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    board.appendChild(renderer.domElement);
    const scene = new T.Scene();
    const cam = new T.OrthographicCamera(-4, 4, 4, -4, 0.1, 50);
    cam.position.set(7, 6.5, 7);
    cam.lookAt(0, 1.1, 0);
    scene.add(new T.HemisphereLight(0xffffff, 0xcbbca3, 0.75));
    const sun = new T.DirectionalLight(0xffffff, 0.5);
    sun.position.set(4, 8, 3);
    scene.add(sun);

    const flat = c => new T.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.9 });
    const box = (w, h, d, c, x, y, z) => { const m = new T.Mesh(new T.BoxGeometry(w, h, d), flat(c)); m.position.set(x, y, z); scene.add(m); return m; };
    box(6, 0.2, 6, 0xdcc8a8, 0, -0.1, 0);              // 바닥
    const back = box(6, 4, 0.2, 0xf7f0e4, 0, 2, -3.1);  // 뒷벽
    const left = box(0.2, 4, 6, 0xf1e8d8, -3.1, 2, 0);  // 옆벽
    const rug = new T.Mesh(new T.CylinderGeometry(1.3, 1.3, 0.03, 10), flat(0xbfefe0));
    rug.position.set(0.4, 0.02, 0.6); scene.add(rug);
    box(1.6, 0.9, 0.8, 0xd6c7b0, 1.8, 0.45, -2.5);      // 선반
    const pot = new T.Mesh(new T.CylinderGeometry(0.25, 0.2, 0.4, 7), flat(0xc98b72));
    pot.position.set(-2.4, 0.2, -2.4); scene.add(pot);
    const leaf = new T.Mesh(new T.IcosahedronGeometry(0.45, 0), flat(0x87cbb9));
    leaf.position.set(-2.4, 0.75, -2.4); scene.add(leaf);

    // 캐릭터: 둥근 로우폴리 몸 + 눈 + 볼 + 더듬이
    const hero = new T.Group();
    const body = new T.Mesh(new T.SphereGeometry(0.55, 10, 7), flat(0x87cbb9));
    body.scale.set(1, 1.1, 0.95); body.position.y = 0.6; hero.add(body);
    const dot = (r, c, x, y, z) => { const m = new T.Mesh(new T.SphereGeometry(r, 6, 4), flat(c)); m.position.set(x, y, z); hero.add(m); return m; };
    dot(0.07, 0x2f3440, -0.17, 0.72, 0.5); dot(0.07, 0x2f3440, 0.17, 0.72, 0.5);
    dot(0.08, 0xf0a58a, -0.3, 0.58, 0.44); dot(0.08, 0xf0a58a, 0.3, 0.58, 0.44);
    const tip = dot(0.1, 0x4f9a87, 0, 1.45, 0);
    const stem = new T.Mesh(new T.CylinderGeometry(0.025, 0.025, 0.35, 5), flat(0x4f9a87));
    stem.position.y = 1.25; hero.add(stem);
    const shadow = new T.Mesh(new T.CircleGeometry(0.5, 12), new T.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.12 }));
    shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.01;
    scene.add(shadow, hero);

    // 메모·스티커 텍스처
    function memoTex(it) {
      const c = document.createElement("canvas"); c.width = c.height = 256;
      const g = c.getContext("2d");
      g.fillStyle = it.color; g.fillRect(0, 0, 256, 256);
      g.fillStyle = "#2f3440"; g.font = "500 30px 'Noto Sans KR', sans-serif";
      let line = "", y = 52;
      for (const ch of it.text) {
        if (g.measureText(line + ch).width > 216) { g.fillText(line, 20, y); line = ""; y += 40; }
        line += ch;
      }
      g.fillText(line, 20, y);
      g.fillStyle = "#6B7280"; g.font = "24px 'Noto Sans KR', sans-serif";
      g.fillText("— " + people[it.by].name, 20, 230);
      return new T.CanvasTexture(c);
    }
    function emojiTex(e) {
      const c = document.createElement("canvas"); c.width = c.height = 128;
      const g = c.getContext("2d");
      g.font = "96px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(e, 64, 70);
      return new T.CanvasTexture(c);
    }
    // 저장 좌표(%) ↔ 방 좌표
    const memoPos = it => new T.Vector3(-2.2 + it.x / 100 * 4.4, 3.3 - it.y / 100 * 2.4, -2.98);
    const stickerPos = it => new T.Vector3(-2.4 + it.x / 100 * 5, 0.4, -2.2 + it.y / 100 * 4.6);

    let items = new T.Group(); scene.add(items);
    function show(home, ownerId) {
      scene.remove(items); items = new T.Group(); scene.add(items);
      home.items.forEach(it => {
        let m;
        if (it.type === "memo") {
          m = new T.Mesh(new T.PlaneGeometry(1.5, 1.5), new T.MeshBasicMaterial({ map: memoTex(it) }));
          m.position.copy(memoPos(it)); m.rotation.z = -it.r * Math.PI / 180;
        } else {
          m = new T.Sprite(new T.SpriteMaterial({ map: emojiTex(it.emoji) }));
          m.scale.set(0.95, 0.95, 1); m.position.copy(stickerPos(it));
        }
        m.userData.it = it;
        items.add(m);
      });
      applySkin(ownerId);
      resize();
    }

    // 사진을 몸 텍스처로 씌움. 직접 고른 사진 > 최근 올린 사진 > 프로필 색
    const loader = new T.TextureLoader();
    function skinFor(ownerId) {
      if (skins[ownerId]) return skins[ownerId];
      const t = rooms.flatMap(r => r.threads).find(t => t.by === ownerId && /^url\(/.test(t.photo || ""));
      return t ? t.photo.slice(4, -1) : null;
    }
    function applySkin(ownerId) {
      body.material.map = null;
      body.material.color.set(people[ownerId].color);
      body.material.needsUpdate = true;
      const url = skinFor(ownerId);
      if (!url) return;
      loader.load(url, tex => {
        if (ownerId !== owner) return; // 그새 다른 홈으로 이동함
        body.material.map = tex;
        body.material.color.set(0xffffff);
        body.material.needsUpdate = true;
      });
    }

    function resize() {
      const w = board.clientWidth, h = board.clientHeight;
      if (!w) return;
      renderer.setSize(w, h, false);
      const a = w / h;
      cam.left = -3.7 * a; cam.right = 3.7 * a; cam.top = 3.7; cam.bottom = -3.7;
      cam.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(board);

    // 돌아다니기 + 점프
    let target = new T.Vector3(), jumpT = 0, raf = null;
    const pickTarget = () => target.set(-2 + Math.random() * 4, 0, -1.6 + Math.random() * 3.6);
    pickTarget();
    function loop(t) {
      raf = requestAnimationFrame(loop);
      const dir = target.clone().sub(hero.position); dir.y = 0;
      if (dir.length() < 0.05) {
        // 멈춰 있을 땐 카메라 쪽을 봄
        hero.rotation.y += (Math.PI / 4 - hero.rotation.y) * 0.05;
        if (Math.random() < 0.006) pickTarget();
      }
      else {
        hero.position.addScaledVector(dir.normalize(), 0.012);
        hero.rotation.y += (Math.atan2(dir.x, dir.z) - hero.rotation.y) * 0.08;
      }
      const bob = Math.abs(Math.sin(t / 180)) * 0.06;
      if (jumpT > 0) jumpT -= 0.03;
      hero.position.y = bob + Math.sin(Math.max(0, jumpT) * Math.PI) * 0.8;
      tip.position.x = Math.sin(t / 300) * 0.06;
      shadow.position.set(hero.position.x, 0.01, hero.position.z);
      renderer.render(scene, cam);
    }

    // 누르기: 캐릭터는 점프, 내 메모·스티커는 끌어서 옮기기
    const ray = new T.Raycaster(), ptr = new T.Vector2();
    const wallPlane = new T.Plane(new T.Vector3(0, 0, 1), 2.98);
    const floorPlane = new T.Plane(new T.Vector3(0, 1, 0), -0.4);
    let dragging = null;
    const aim = e => {
      const r = renderer.domElement.getBoundingClientRect();
      ptr.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
      ray.setFromCamera(ptr, cam);
    };
    renderer.domElement.addEventListener("pointerdown", e => {
      aim(e);
      const hit = ray.intersectObjects(items.children)[0];
      if (hit && hit.object.userData.it.by === "me") {
        dragging = hit.object;
        renderer.domElement.setPointerCapture(e.pointerId);
      } else if (ray.intersectObject(hero, true).length) {
        jumpT = 1;
      }
    });
    renderer.domElement.addEventListener("pointermove", e => {
      if (!dragging) return;
      aim(e);
      const it = dragging.userData.it, p = new T.Vector3();
      const clamp = v => Math.min(95, Math.max(5, v));
      if (it.type === "memo" && ray.ray.intersectPlane(wallPlane, p)) {
        it.x = clamp((p.x + 2.2) / 4.4 * 100); it.y = clamp((3.3 - p.y) / 2.4 * 100);
        dragging.position.copy(memoPos(it));
      } else if (it.type === "sticker" && ray.ray.intersectPlane(floorPlane, p)) {
        it.x = clamp((p.x + 2.4) / 5 * 100); it.y = clamp((p.z + 2.2) / 4.6 * 100);
        dragging.position.copy(stickerPos(it));
      }
    });
    renderer.domElement.addEventListener("pointerup", () => { dragging = null; });

    return {
      show,
      applySkin,
      start() { if (!raf) raf = requestAnimationFrame(loop); },
      stop() { cancelAnimationFrame(raf); raf = null; },
    };
  })();

  const tilt = () => Math.round(Math.random() * 16 - 8);
  const currentHome = () => visibleHomes(owner)[homeIdx];
  emojis.forEach(em => {
    const b = document.createElement("button");
    b.className = "emo"; b.textContent = em; b.setAttribute("aria-label", em + " 스티커 붙이기");
    b.onclick = () => {
      currentHome().items.push({ type: "sticker", by: "me", emoji: em, x: 20 + Math.random() * 60, y: 45 + Math.random() * 45, r: tilt() });
      renderMine();
    };
    document.getElementById("emos").appendChild(b);
  });
  memoColors.forEach(c => {
    const b = document.createElement("button");
    b.style.background = c; b.setAttribute("aria-label", "메모 색");
    if (c === memoColor) b.className = "on";
    b.onclick = () => {
      memoColor = c;
      document.querySelectorAll("#memoColors button").forEach(x => x.classList.toggle("on", x === b));
    };
    document.getElementById("memoColors").appendChild(b);
  });
  document.getElementById("memoBtn").onclick = () => {
    const f = document.getElementById("memoForm");
    f.hidden = !f.hidden;
    if (!f.hidden) document.getElementById("memoText").focus();
  };
  document.getElementById("memoPost").onclick = () => {
    const text = document.getElementById("memoText").value.trim();
    if (!text) { document.getElementById("memoText").focus(); return; }
    currentHome().items.push({ type: "memo", by: "me", text, color: memoColor, x: 50, y: 50, r: tilt() });
    document.getElementById("memoText").value = "";
    document.getElementById("memoForm").hidden = true;
    renderMine();
  };

  document.getElementById("meBtn").onclick = () => { owner = "me"; homeIdx = 0; renderMine(); app.classList.add("mine-open"); room3d.start(); };
  const skinFile = document.getElementById("skinFile");
  document.getElementById("skinBtn").onclick = () => skinFile.click();
  skinFile.onchange = () => {
    const f = skinFile.files[0];
    if (!f) return;
    skins.me = URL.createObjectURL(f);
    skinFile.value = "";
    room3d.applySkin("me");
  };
  document.getElementById("mineBack").onclick = () => { app.classList.remove("mine-open"); room3d.stop(); };

  renderHome();
</script>
</body>
</html>
