<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PatPat Cam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* 카메라가 첫 화면. 찍은 사진을 캐릭터에게 주면 자람 */
  :root {
    --bg: #0b0b0c;
    --surface: #161618;
    --chip: #232326;
    --line: #ffffff14;
    --ink: #f2f2f3;
    --muted: #8e8e93;
    --teal: #87CBB9;
    --deep: #4f9a87;
    --warm: #f0a58a;
    --red: #ff453a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: "Noto Sans KR", system-ui, sans-serif; font-size: 14px; letter-spacing: -0.02em;
    -webkit-font-smoothing: antialiased; display: flex; justify-content: center;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .app { position: relative; width: 100%; max-width: 480px; height: 100%; overflow: hidden; background: #000; }
  .view { position: absolute; inset: 0; display: flex; flex-direction: column; }

  /* 카메라 */
  .cam video, .cam .still { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cam .still { background-size: cover; background-position: center; }
  .nocam { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 32px; color: var(--muted); font-size: 13px; line-height: 1.7;
    background: radial-gradient(circle at 50% 40%, #1d1f22, #000 70%); }
  .nocam b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 6px; }
  .cam-top { position: absolute; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 30px;
    display: flex; align-items: center; justify-content: space-between; background: linear-gradient(#0009, #0000); }
  .wordmark { font-size: 18px; font-weight: 800; letter-spacing: -0.05em; }
  .wordmark::after { content: "."; color: var(--teal); }
  .mini-gauges { display: flex; flex-direction: column; gap: 5px; width: 120px; }
  .mg { display: flex; align-items: center; gap: 6px; font-size: 10px; color: #ffffffcc; }
  .mg span { width: 30px; }
  .mg i { flex: 1; height: 3px; background: #ffffff33; border-radius: 3px; overflow: hidden; }
  .mg i b { display: block; height: 100%; background: var(--teal); border-radius: 3px; transition: width .4s; }
  .mg.low i b { background: var(--warm); }
  .cam-bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 28px calc(env(safe-area-inset-bottom, 0px) + 28px);
    display: flex; align-items: center; justify-content: space-between; background: linear-gradient(#0000, #000a); }
  .round { width: 52px; height: 52px; border-radius: 50%; overflow: hidden; background: var(--chip); background-size: cover; background-position: center; box-shadow: 0 0 0 2px #ffffff40; }
  .round img { width: 100%; height: 100%; object-fit: cover; transform: translateY(8%) scale(1.1); }
  .face-btn { position: relative; }
  .face-btn .alert { position: absolute; top: -2px; right: -2px; width: 14px; height: 14px; border-radius: 50%; background: var(--red); border: 2px solid #000; }
  .shutter { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; display: grid; place-items: center; }
  .shutter::after { content: ""; width: 60px; height: 60px; border-radius: 50%; background: #fff; transition: transform .12s; }
  .shutter:active::after { transform: scale(.88); }

  /* 찍은 뒤: 무엇을 찍었는지 고르기 */
  .pick { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 18px calc(env(safe-area-inset-bottom, 0px) + 22px);
    background: #0b0b0cf2; backdrop-filter: blur(16px); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; gap: 14px; animation: up .25s ease; }
  .pick h2 { font-size: 16px; font-weight: 800; }
  .pick p { font-size: 12px; color: var(--muted); margin-top: -8px; }
  .kinds { display: flex; flex-wrap: wrap; gap: 8px; }
  .kinds button { height: 38px; padding: 0 16px; border-radius: 999px; background: var(--chip); font-size: 13px; font-weight: 600; color: #ffffffd9; }
  .kinds button.on { background: var(--ink); color: var(--bg); }
  .pick-btns { display: flex; gap: 8px; }
  .pick-btns button { flex: 1; height: 48px; border-radius: 999px; font-weight: 700; font-size: 14px; }
  .again { background: var(--chip); }
  .give { background: var(--ink); color: var(--bg); }
  .give:disabled { opacity: .35; }

  /* 캐릭터 */
  .pet { background: radial-gradient(circle at 50% 38%, #1f2a27 0%, var(--bg) 62%); overflow-y: auto; }
  .bar-top { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top, 0px) + 10px) 10px 0; height: 56px; }
  .bar-top button { width: 40px; height: 40px; font-size: 20px; }
  .bar-top h1 { font-size: 16px; font-weight: 800; flex: 1; }
  .stage { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--chip); color: #ffffffd9; margin-right: 8px; }
  .stage-wrap { position: relative; height: 340px; display: grid; place-items: end center; padding-bottom: 26px; }
  .stage-wrap::after { content: ""; position: absolute; bottom: 18px; width: 150px; height: 18px; border-radius: 50%; background: #0007; filter: blur(4px); z-index: 0; }
  .char { position: relative; z-index: 1; display: inline-block; transform-origin: 50% 100%; transition: width .6s cubic-bezier(.2,1.4,.4,1); animation: idle 2.4s ease-in-out infinite; }
  .char img { display: block; width: 100%; }
  .char .belly { position: absolute; border-radius: 50%; background-size: cover; background-position: center; box-shadow: inset 0 0 0 2px #0000002e; }
  .char.hop { animation: hop .5s ease; }
  .char.sad { filter: saturate(.55) brightness(.85); }
  .bubble { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); z-index: 2; max-width: 80%; background: #fff; color: #111; font-size: 13px; font-weight: 600; padding: 9px 14px; border-radius: 16px; text-align: center; animation: pop .3s ease; }
  .bubble::after { content: ""; position: absolute; bottom: -6px; left: 50%; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: #fff; }
  .flying { position: absolute; z-index: 3; width: 120px; height: 120px; border-radius: 50%; background-size: cover; background-position: center; left: 50%; top: 40%; transform: translate(-50%, -50%); animation: fly .8s ease-in forwards; box-shadow: 0 8px 30px #0008; }
  .stats { padding: 6px 22px 8px; display: flex; flex-direction: column; gap: 14px; }
  .stat-hd { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .stat-hd b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
  .gauge { height: 8px; border-radius: 8px; background: var(--chip); overflow: hidden; }
  .gauge i { display: block; height: 100%; border-radius: 8px; background: var(--teal); transition: width .6s; }
  .gauge.warm i { background: var(--warm); }
  .gauge.grow i { background: linear-gradient(90deg, var(--deep), var(--teal)); }
  .today { margin: 14px 22px 0; padding: 14px 16px; border-radius: 16px; background: var(--surface); display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; }
  .today b { display: block; font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .today span { font-size: 10px; color: var(--muted); }
  .tip { margin: 12px 22px 0; font-size: 11px; color: var(--muted); line-height: 1.6; }
  .to-cam { margin: 18px 22px calc(env(safe-area-inset-bottom, 0px) + 24px); height: 52px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 800; font-size: 15px; }

  /* 기록 */
  .log { background: var(--bg); }
  .log-grid { flex: 1; overflow-y: auto; padding: 4px 2px calc(env(safe-area-inset-bottom, 0px) + 20px); }
  .day { font-size: 12px; font-weight: 700; color: var(--muted); padding: 18px 16px 8px; }
  .cells { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
  .cell { position: relative; aspect-ratio: 1; background-size: cover; background-position: center; }
  .cell span { position: absolute; left: 6px; bottom: 6px; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: #000a; }
  .empty { padding: 60px 24px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.7; }

  /* 처음: 함께할 친구 고르기 */
  .hello { background: var(--bg); justify-content: center; align-items: center; text-align: center; gap: 8px; padding: 24px; }
  .hello h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.04em; }
  .hello p { color: var(--muted); font-size: 13px; }
  .eggs { display: flex; gap: 12px; margin-top: 28px; width: 100%; }
  .eggs button { flex: 1; padding: 18px 10px 14px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .eggs img { width: 100%; height: 150px; object-fit: contain; }
  .eggs b { font-size: 14px; }
  .eggs span { font-size: 11px; color: var(--muted); }

  .toast { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 70px); transform: translateX(-50%); z-index: 20; background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 600; padding: 10px 16px; border-radius: 999px; max-width: 90%; text-align: center; animation: pop .25s ease; }

  @keyframes up { from { transform: translateY(100%); } }
  @keyframes idle { 50% { transform: translateY(-6px); } }
  @keyframes hop { 30% { transform: translateY(-40px) scale(1.04, .96); } 60% { transform: translateY(0) scale(1.06, .92); } }
  @keyframes pop { from { transform: translateX(-50%) scale(.8); opacity: 0; } }
  @keyframes fly { to { top: 74%; width: 40px; height: 40px; opacity: .2; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">

  <section class="view hello" id="hello" hidden>
    <h1>함께할 친구를 골라요</h1>
    <p>사진을 찍어서 먹이고 보여주면 무럭무럭 자라요</p>
    <div class="eggs" id="eggs"></div>
  </section>

  <section class="view cam" id="cam">
    <video id="video" playsinline muted autoplay hidden></video>
    <div class="nocam" id="nocam" hidden>
      <div><b>카메라를 쓸 수 없어요</b>휴대폰에서 열면 바로 찍을 수 있어요.<br>지금은 아래 셔터를 눌러 사진을 골라 주세요.</div>
    </div>
    <div class="still" id="still" hidden></div>
    <input type="file" id="file" accept="image/*" capture="environment" hidden>

    <div class="cam-top">
      <span class="wordmark">PatPat</span>
      <div class="mini-gauges" id="miniGauges"></div>
    </div>

    <div class="cam-bottom" id="camBottom">
      <button class="round face-btn" id="toPet" aria-label="내 캐릭터"><img id="faceImg" alt=""><i class="alert" id="alert" hidden></i></button>
      <button class="shutter" id="shutter" aria-label="찍기"></button>
      <button class="round" id="toLog" aria-label="기록"></button>
    </div>

    <div class="pick" id="pick" hidden>
      <h2>무엇을 찍었나요?</h2>
      <p id="pickHint">고른 종류에 따라 캐릭터가 다르게 자라요</p>
      <div class="kinds" id="kinds"></div>
      <div class="pick-btns">
        <button class="again" id="again">다시 찍기</button>
        <button class="give" id="give" disabled>캐릭터에게 주기</button>
      </div>
    </div>
  </section>

  <section class="view pet" id="pet" hidden>
    <div class="bar-top">
      <button id="petBack" aria-label="카메라로">←</button>
      <h1 id="petName"></h1>
      <span class="stage" id="stage"></span>
    </div>
    <div class="stage-wrap" id="stageWrap"></div>
    <div class="stats" id="stats"></div>
    <div class="today" id="today"></div>
    <p class="tip" id="tip"></p>
    <button class="to-cam" id="toCam">사진 찍으러 가기</button>
  </section>

  <section class="view log" id="log" hidden>
    <div class="bar-top">
      <button id="logBack" aria-label="카메라로">←</button>
      <h1>기록</h1>
    </div>
    <div class="log-grid" id="logGrid"></div>
  </section>

  <div class="toast" id="toast" hidden></div>
</div>

<script>
  const $ = id => document.getElementById(id);

  const species = {
    horse: { name: "구름말", src: "assets/chars/horse.png", face: "assets/chars/horse-face.png", belly: { x: 50.1, y: 77.7, w: 31.5, h: 21.2 }, note: "하늘과 풍경을 좋아해요" },
    dino: { name: "뿔룡", src: "assets/chars/dino.png", face: "assets/chars/dino-face.png", belly: { x: 50.5, y: 82.3, w: 24.8, h: 26.6 }, note: "맛있는 음식을 좋아해요" },
  };
  // 찍은 것의 종류마다 주는 효과. 좋아하는 것은 1.5배
  const kinds = {
    food:  { label: "음식", hunger: 30, mood: 5, grow: 12, likes: "dino" },
    sky:   { label: "하늘·풍경", hunger: 0, mood: 25, grow: 5, likes: "horse" },
    place: { label: "새로운 곳", hunger: 0, mood: 12, grow: 10 },
    friend:{ label: "친구", hunger: 0, mood: 20, grow: 8 },
    etc:   { label: "그 밖에", hunger: 0, mood: 6, grow: 3 },
  };
  const stages = [
    { name: "알에서 막 나온", at: 0, size: 130 },
    { name: "아기", at: 40, size: 160 },
    { name: "어린이", at: 120, size: 195 },
    { name: "청소년", at: 260, size: 230 },
    { name: "어른", at: 480, size: 260 },
  ];
  const H = 3600e3;
  const DAILY_GROW = 6; // 하루에 성장이 반영되는 사진 수

  // 저장: 이 기기에만. 실패해도 동작
  let state = load() || { species: null, hunger: 60, mood: 60, grow: 0, updated: Date.now(), photos: [] };
  function load() { try { return JSON.parse(localStorage.getItem("patpat.cam")); } catch (e) { return null; } }
  function save() {
    try { localStorage.setItem("patpat.cam", JSON.stringify(state)); }
    catch (e) { state.photos = state.photos.slice(0, 30); try { localStorage.setItem("patpat.cam", JSON.stringify(state)); } catch (e2) {} }
  }

  // 시간이 지나면 배고프고 심심해짐 (시간당 배부름 -5, 기분 -3)
  function decay() {
    const hours = (Date.now() - state.updated) / H;
    state.hunger = Math.max(0, state.hunger - hours * 5);
    state.mood = Math.max(0, state.mood - hours * 3);
    state.updated = Date.now();
  }
  const stageOf = g => stages.reduce((s, x) => (g >= x.at ? x : s), stages[0]);
  const nextStage = g => stages.find(x => x.at > g);
  const todayKey = t => new Date(t).toDateString();
  const todays = () => state.photos.filter(p => todayKey(p.at) === todayKey(Date.now()));

  function mood() {
    if (state.hunger < 25) return { text: "배고파요… 맛있는 거 찍어 주세요", sad: true };
    if (state.mood < 25) return { text: "심심해요. 바깥 구경 시켜 주세요", sad: true };
    if (state.hunger > 92) return { text: "배불러요! 이번엔 하늘을 보여 줄래요?", sad: false };
    if (state.mood > 80) return { text: "오늘 기분 최고예요", sad: false };
    return { text: "오늘은 뭐 찍을 거예요?", sad: false };
  }

  function charHTML(photo, width, cls = "") {
    const k = species[state.species], b = k.belly;
    return `<span class="char ${cls}" id="char" style="width:${width}px"><img src="${k.src}" alt="${k.name}">${photo
      ? `<i class="belly" style="left:${b.x - b.w / 2}%;top:${b.y - b.h / 2}%;width:${b.w}%;height:${b.h}%;background-image:url(${photo})"></i>` : ""}</span>`;
  }

  function gauge(label, value, max, cls = "") {
    return `<div><div class="stat-hd"><span>${label}</span><b>${Math.round(value)} / ${max}</b></div>
      <div class="gauge ${cls}"><i style="width:${Math.min(100, value / max * 100)}%"></i></div></div>`;
  }

  // ---------- 화면 그리기 ----------
  function renderCam() {
    decay();
    const k = species[state.species];
    $("faceImg").src = k.face;
    $("alert").hidden = !mood().sad;
    $("miniGauges").innerHTML = [["배부름", state.hunger], ["기분", state.mood]].map(([l, v]) =>
      `<div class="mg ${v < 25 ? "low" : ""}"><span>${l}</span><i><b style="width:${v}%"></b></i></div>`).join("");
    const last = state.photos[0];
    $("toLog").style.backgroundImage = last ? `url(${last.img})` : "none";
  }

  function renderPet(message) {
    decay();
    const st = stageOf(state.grow), nx = nextStage(state.grow), m = mood();
    const k = species[state.species];
    $("petName").textContent = k.name;
    $("stage").textContent = st.name;
    const belly = state.photos[0] && state.photos[0].img;
    $("stageWrap").innerHTML = `<div class="bubble">${message || m.text}</div>` + charHTML(belly, st.size, m.sad ? "sad" : "");
    $("char").onclick = e => { const c = e.currentTarget; c.classList.remove("hop"); void c.offsetWidth; c.classList.add("hop"); };
    $("stats").innerHTML =
      gauge("배부름", state.hunger, 100, state.hunger < 25 ? "warm" : "") +
      gauge("기분", state.mood, 100, state.mood < 25 ? "warm" : "") +
      (nx ? gauge(`다음 단계 "${nx.name}"까지`, state.grow - st.at, nx.at - st.at, "grow")
          : `<div class="stat-hd"><span>다 자랐어요</span><b>${Math.round(state.grow)}</b></div>`);
    const t = todays();
    const count = key => t.filter(p => p.kind === key).length;
    $("today").innerHTML = [["음식", "food"], ["하늘", "sky"], ["새로운 곳", "place"], ["친구", "friend"]]
      .map(([l, key]) => `<div><b>${count(key)}</b><span>오늘 ${l}</span></div>`).join("");
    $("tip").textContent = `${k.note}. 같은 사진은 다시 줄 수 없고, 하루에 ${DAILY_GROW}장까지 키가 자라요. 많이 먹이기보다 여러 가지를 보여 줄수록 잘 자라요.`;
  }

  function renderLog() {
    if (!state.photos.length) {
      $("logGrid").innerHTML = `<p class="empty">아직 찍은 사진이 없어요.<br>카메라로 첫 사진을 찍어 보세요</p>`;
      return;
    }
    const days = new Map();
    state.photos.forEach(p => { const d = todayKey(p.at); days.set(d, [...(days.get(d) || []), p]); });
    $("logGrid").innerHTML = [...days].map(([d, list]) => {
      const date = new Date(list[0].at);
      const label = d === todayKey(Date.now()) ? "오늘" : `${date.getMonth() + 1}월 ${date.getDate()}일`;
      return `<div class="day">${label} · ${list.length}장</div><div class="cells">${list.map(p =>
        `<div class="cell" style="background-image:url(${p.img})"><span>${kinds[p.kind].label}</span></div>`).join("")}</div>`;
    }).join("");
  }

  function show(id) {
    ["hello", "cam", "pet", "log"].forEach(v => { $(v).hidden = v !== id; });
    if (id === "cam") { renderCam(); startCamera(); } else stopCamera();
    if (id === "pet") renderPet();
    if (id === "log") renderLog();
  }

  function toast(text) {
    const el = $("toast"); el.textContent = text; el.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2400);
  }

  // ---------- 카메라 ----------
  let stream = null;
  async function startCamera() {
    if (stream) return;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
      $("video").srcObject = stream; $("video").hidden = false; $("nocam").hidden = true;
    } catch (e) {
      $("video").hidden = true; $("nocam").hidden = false;
    }
  }
  function stopCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  // 사진을 저장용으로 작게(긴 변 480px) 줄이고, 같은 사진인지 가리는 8x8 지문을 만듦
  function process(source, w, h) {
    const k = Math.min(1, 480 / Math.max(w, h));
    const c = document.createElement("canvas");
    c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext("2d").drawImage(source, 0, 0, c.width, c.height);
    const f = document.createElement("canvas"); f.width = f.height = 8;
    const g = f.getContext("2d"); g.drawImage(c, 0, 0, 8, 8);
    const d = g.getImageData(0, 0, 8, 8).data, gray = [];
    for (let i = 0; i < d.length; i += 4) gray.push(d[i] * .3 + d[i + 1] * .59 + d[i + 2] * .11);
    const avg = gray.reduce((a, b) => a + b) / 64;
    return { img: c.toDataURL("image/jpeg", 0.78), hash: gray.map(v => (v > avg ? 1 : 0)).join("") };
  }
  const sameAs = h => state.photos.find(p => [...p.hash].filter((b, i) => b !== h[i]).length <= 4);

  let shot = null, kind = null;
  function openPick(p) {
    shot = p; kind = null;
    $("still").style.backgroundImage = `url(${p.img})`; $("still").hidden = false;
    $("camBottom").hidden = true; $("pick").hidden = false;
    $("give").disabled = true;
    $("pickHint").textContent = sameAs(p.hash) ? "이미 준 사진과 똑같아요. 새로 찍어 주세요" : "고른 종류에 따라 캐릭터가 다르게 자라요";
    renderKinds();
  }
  function closePick() {
    shot = null; $("still").hidden = true; $("pick").hidden = true; $("camBottom").hidden = false;
  }
  function renderKinds() {
    $("kinds").innerHTML = Object.entries(kinds).map(([key, v]) =>
      `<button data-k="${key}" class="${kind === key ? "on" : ""}">${v.label}</button>`).join("");
    $("kinds").querySelectorAll("button").forEach(b => b.onclick = () => {
      kind = b.dataset.k; renderKinds();
      $("give").disabled = !!sameAs(shot.hash);
    });
  }

  $("shutter").onclick = () => {
    const v = $("video");
    if (stream && v.videoWidth) openPick(process(v, v.videoWidth, v.videoHeight));
    else $("file").click();
  };
  $("file").onchange = () => {
    const f = $("file").files[0];
    if (!f) return;
    const img = new Image();
    img.onload = () => { openPick(process(img, img.naturalWidth, img.naturalHeight)); URL.revokeObjectURL(img.src); };
    img.src = URL.createObjectURL(f);
    $("file").value = "";
  };
  $("again").onclick = closePick;

  // 주기: 효과 계산 → 캐릭터 화면에서 사진이 배로 들어감
  $("give").onclick = () => {
    if (!shot || !kind || sameAs(shot.hash)) return;
    decay();
    const k = kinds[kind], liked = k.likes === state.species ? 1.5 : 1;
    const before = stageOf(state.grow);
    const full = kind === "food" && state.hunger > 92;
    const counted = todays().length < DAILY_GROW;
    let grow = full || !counted ? 0 : k.grow * liked;
    // 처음 보는 종류면 보너스 (같은 것만 주기보다 골고루)
    if (grow && !todays().some(p => p.kind === kind)) grow += 4;
    state.hunger = Math.min(100, state.hunger + k.hunger * liked);
    state.mood = Math.min(100, state.mood + k.mood * liked);
    state.grow += grow;
    state.photos.unshift({ img: shot.img, hash: shot.hash, kind, at: Date.now() });
    state.photos = state.photos.slice(0, 60);
    save();
    const img = shot.img;
    closePick();
    show("pet");
    const fly = document.createElement("div");
    fly.className = "flying"; fly.style.backgroundImage = `url(${img})`;
    $("stageWrap").appendChild(fly);
    setTimeout(() => fly.remove(), 820);
    const after = stageOf(state.grow);
    const msg = after !== before ? `"${after.name}" 단계로 자랐어요!`
      : full ? "배불러요… 그래도 고마워요"
      : !counted ? "오늘은 충분히 자랐어요. 내일 또 보여 주세요"
      : liked > 1 ? `좋아하는 ${k.label}! 쑥쑥 자라요`
      : `${k.label} 고마워요!`;
    setTimeout(() => renderPet(msg), 820);
    if (grow) toast(`성장 +${Math.round(grow)}`);
  };

  // ---------- 이동 ----------
  $("toPet").onclick = () => show("pet");
  $("toLog").onclick = () => show("log");
  $("petBack").onclick = $("toCam").onclick = $("logBack").onclick = () => show("cam");

  // 처음: 함께할 친구 고르기
  $("eggs").innerHTML = Object.entries(species).map(([key, v]) =>
    `<button data-s="${key}"><img src="${v.src}" alt=""><b>${v.name}</b><span>${v.note}</span></button>`).join("");
  $("eggs").querySelectorAll("button").forEach(b => b.onclick = () => {
    state.species = b.dataset.s; state.updated = Date.now(); save();
    show("pet");
    renderPet(`안녕! 나는 ${species[state.species].name}. 사진으로 나를 키워 줘`);
  });

  show(state.species ? "cam" : "hello");
  setInterval(() => { if (!$("cam").hidden) renderCam(); }, 60e3);
</script>
</body>
</html>
